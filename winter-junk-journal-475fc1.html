:root{--bg:#e9edf3;--ink:#14203d;--navy:#1f2f57;--mute:#6f7a90;--line:#d5dbe5;--card:#fbfaf6;--gold:#c9a44c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overscroll-behavior:none}
button,select,textarea,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.wrap{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 6px}
header .ttl{flex:1;text-align:center;line-height:1.15}header .ttl b{display:block;font-family:'Cormorant Garamond';font-size:22px;font-weight:600;letter-spacing:.02em}header .ttl span{font-size:12px;color:var(--mute)}
.nb{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:24px;line-height:1;display:grid;place-items:center;color:var(--navy)}
.nb.menu{font-size:20px}
#stage{flex:1;position:relative;min-height:0;overflow:hidden;margin:0 8px}
#page{position:absolute;width:1000px;height:1400px;transform-origin:0 0;background-size:100% 100%;box-shadow:0 10px 30px rgba(20,32,61,.25);border-radius:6px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.el{position:absolute;transform-origin:50% 50%;touch-action:none;cursor:grab}
.el>img{width:100%;height:100%;display:block;pointer-events:none}
.el .tx{position:absolute;display:flex;line-height:1.12;overflow:hidden;white-space:pre-wrap;word-break:normal;overflow-wrap:normal;hyphens:none;pointer-events:none}
.el .tx.lined{overflow-wrap:break-word}
.el .tx.lined{line-height:1.15}
.el.sel{outline:3px dashed rgba(201,164,76,.95);outline-offset:4px}
.hdl{position:absolute;right:-28px;bottom:-28px;width:56px;height:56px;border-radius:50%;background:var(--gold);border:5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:nwse-resize;touch-action:none}
.hdl::after{content:'↻';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:inherit;font-weight:700}
svg.ink{position:absolute;inset:0;width:100%;height:100%}
#seltools{display:none;gap:6px;overflow-x:auto;padding:8px 12px 2px;scrollbar-width:none}
#seltools.on{display:flex}
#seltools button{white-space:nowrap;padding:8px 12px;border-radius:999px;background:var(--navy);color:#fff;font-size:13.5px;font-weight:600}
#seltools button.del{background:#9c2f35}
.drawer{background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));margin-top:8px}
#dtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
#dtabs button{white-space:nowrap;padding:7px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--mute)}
#dtabs button.on{background:var(--navy);color:#fff}
.grid{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;min-height:96px;align-items:center}
.grid .it{flex:none;width:86px;height:96px;border-radius:12px;background:#eef1f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px;font-size:10.5px;color:var(--mute);font-weight:600}
.grid .it img{max-width:100%;max-height:70px;object-fit:contain;border-radius:4px}
.grid .it.paper img{max-height:66px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.grid .it.on{outline:2.5px solid var(--gold)}
.grid .it.add{font-size:28px;color:var(--navy);border:2px dashed var(--line);background:none}.grid .it.add span{font-size:10.5px;text-align:center}
.grid.words{flex-wrap:nowrap}
.grid .word{flex:none;padding:12px 16px;border-radius:12px;background:#eef1f6;font-family:'Courier New',monospace;font-size:15px;white-space:nowrap}
.grid .word.on{background:var(--navy);color:#fff}
.grid .dot{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}.grid .dot.on{box-shadow:0 0 0 3px var(--gold)}
#dhint{margin:2px 4px 0;font-size:12px;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(20,32,61,.35);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.mc{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.mc h3{font-family:'Cormorant Garamond';font-size:24px;margin:0 0 8px}
.f{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;margin:4px 0;font-size:16px;outline:none;resize:vertical}
textarea.f{font-size:22px}
.l{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:8px 0 2px}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1}
input[type=range]{width:100%;accent-color:var(--navy)}
.cols{display:flex;gap:8px;margin-top:10px}.cols button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}.cols button.on{box-shadow:0 0 0 3px var(--gold)}
.btn{padding:12px 16px;border-radius:12px;background:#eef1f6;font-weight:600}.btn.pri{background:var(--navy);color:#fff}.btn.danger{color:#9c2f35}
.hint{font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60}.toast.show{opacity:1}
#printarea{display:none}
@media print{.wrap,.modal,.toast{display:none!important}#printarea{display:block}#printarea img{width:100%;page-break-after:always;display:block}@page{size:A5;margin:0}}
@media(min-width:900px){.mc{border-radius:20px;margin-bottom:10vh}.modal{align-items:center}}

</style>

<script>
/* ---------- Winter junk journal art (SVG generators, no text inside SVG) ---------- */
const PAL={navy:'#1f2f57',navy2:'#2b3f70',ink:'#14203d',ice:'#dfe8f3',snow:'#f7f9fc',cream:'#f3ead8',cream2:'#e9dcc0',kraft:'#c9a77c',gold:'#c9a44c',gold2:'#e3c77d',red:'#9c2f35',sage:'#7f9c84',mist:'#9fb3cf'};

 if(tab===6){g.className='grid words';g.append(h('button',{class:'word'+(pen?' on':''),onclick:()=>{pen=!pen;sel=null;renderPage();renderDrawer()}},pen?t('penOff'):t('penOn')));['#1f2f57','#14203d','#9c2f35','#c9a44c','#ffffff'].forEach(c2=>g.append(h('button',{class:'dot'+(penCol===c2?' on':''),style:`background:${c2}`,onclick:()=>{penCol=c2;pen=true;renderPage();renderDrawer()}})));[3,6,12].forEach(w=>g.append(h('button',{class:'word'+(penW===w?' on':''),onclick:()=>{penW=w;renderDrawer()}},'●'.padStart(1)+` ${w}`)));g.append(h('button',{class:'word',onclick:()=>{(pages[cur].strokes||[]).pop();save();renderPage()}},t('undo')))}
 if(tab!==4)$('#dhint').textContent=tab===6?t('penHint'):t('tapHint')}
async function shrink(file,max=1400){const u=URL.createObjectURL(file);const im=new Image();await new Promise(r=>{im.onload=im.onerror=r;im.src=u});const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return c.toDataURL('image/jpeg',.85)}
/* ---------- export ---------- */
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
function wrapLines(c,txt,maxW){const out=[];for(const para of String(txt).split('\n')){let line='';for(const w of para.split(' ')){const tt=line?line+' '+w:w;if(c.measureText(tt).width>maxW&&line){out.push(line);line=w}else line=tt}out.push(line)}return out}
async function pageCanvas(P,k=2){const c=document.createElement('canvas');c.width=PW*k;c.height=PH*k;const x=c.getContext('2d');x.scale(k,k);const bg=await loadImg(svgURL(paperSVG(P.paper)));if(bg)x.drawImage(bg,0,0,PW,PH);
 for(const el of P.els){const [w,hh]=elSize(el);x.save();x.translate(el.x,el.y);x.rotate(el.r*Math.PI/180);x.scale(el.s,el.s);x.translate(-w/2,-hh/2);if(el.t!=='text'){const im=await loadImg(svgURL(elSVG(el)));if(im)x.drawImage(im,0,0,w,hh)}
  for(const sp of textSpec(el)){if(!sp.txt)continue;const [bx,by,bw,bh]=sp.box;const X=bx*w,Y=by*hh,BW=bw*w,BH=bh*hh;let fs=sp.fs;const fnt=s=>`${sp.it?'italic ':''}500 ${s}px '${sp.font}'`;x.font=fnt(fs);let txt=sp.up?sp.txt.toUpperCase():sp.txt;let ls=wrapLines(x,txt,BW);while(!sp.lined&&(ls.length*fs*1.15>BH||ls.some(l=>x.measureText(l).width>BW))&&fs>12){fs-=2;x.font=fnt(fs);ls=wrapLines(x,txt,BW)}
   x.fillStyle=sp.col;x.textBaseline='middle';x.textAlign=sp.al==='left'?'left':'center';const lh=fs*1.15;let y0=sp.lined?Y+lh/2:Y+BH/2-(ls.length-1)*lh/2;ls.forEach((l,i)=>x.fillText(l,sp.al==='left'?X:X+BW/2,y0+i*lh))}x.restore()}
 for(const s of P.strokes||[]){x.strokeStyle=s.c;x.lineWidth=s.w;x.lineCap='round';x.lineJoin='round';x.beginPath();s.p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.stroke()}return c}
function dl(b,n){const u=URL.createObjectURL(b);const a=h('a',{href:u,download:n});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),20000)}

 c.append(h('h3',{},t('app')),b(t('png'),exportPNG,'pri'),b(t('pdf'),printAll),b(t('addPage'),addPage),b(t('delPage'),()=>{if(pages.length>1&&confirm(t('delPageQ'))){pages.splice(cur,1);cur=Math.max(0,cur-1);save();renderPage()}}),b(t('lang'),()=>{LANG=LANG==='de'?'en':'de';try{localStorage.setItem('lv-jj-lang',LANG)}catch(e){}renderPage();renderDrawer()}),b(t('reset'),()=>{if(confirm(t('resetQ'))){pages=template();cur=0;sel=null;save();renderPage()}},'danger'),h('p',{class:'hint',style:'text-align:center;margin-top:12px'},'© Lia Valentina · '+(LANG==='de'?'Nur für den persönlichen Gebrauch':'For personal use only')));m.classList.add('show')}
function addPage(){pages.splice(cur+1,0,{id:uid(),paper:['cream','ledger','snow','music','grid','kraft','navy'][pages.length%7],els:[],strokes:[]});cur++;sel=null;save();renderPage()}
