*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f1ede7;color:#2e2a27;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.gwrap,.scr{background:var(--bg);color:var(--ink);min-height:100%;position:relative;overflow-x:hidden}.gwrap{min-height:100vh}
.gv{max-width:480px;margin:0 auto;position:relative;min-height:100%}
.mus{position:absolute;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.12);cursor:pointer}
.mus.on{background:var(--acc);color:#fff;animation:pul 2s infinite}@keyframes pul{50%{box-shadow:0 0 0 8px rgba(0,0,0,.06)}}
.phone .gv .mus{top:40px}
/* envelope */
.envS{position:relative;height:100vh;min-height:620px;max-height:900px;overflow:hidden;cursor:pointer;background:var(--eb);transition:opacity .6s}
.scr .envS{height:716px;min-height:0}
.envS.gone{display:none}
.envS .eh{position:absolute;top:17%;left:0;right:0;text-align:center;font:40px/1.1 'Great Vibes';color:var(--acc);padding:0 20px}
.env{position:absolute;left:8%;right:8%;top:38%;aspect-ratio:1.5;perspective:900px}
.env .back{position:absolute;inset:0;background:var(--e1);border-radius:6px;box-shadow:0 16px 30px rgba(60,70,55,.2)}
.env .letter{position:absolute;left:6%;right:6%;top:8%;height:86%;background:#fffdf8;border-radius:4px;display:flex;align-items:flex-start;justify-content:center;padding-top:14%;font:40px 'Great Vibes';color:var(--acc);transition:transform 1s .5s cubic-bezier(.3,.6,.3,1)}
.env .front{position:absolute;inset:0;background:var(--e2);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:6px}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;background:var(--e3);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease;border-radius:6px 6px 0 0}
.env .seal{position:absolute;left:50%;top:62%;width:86px;height:86px;margin:-43px 0 0 -43px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6cf8e,#b48d42 60%,#8f6c2c);box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 0 0 7px rgba(255,255,255,.18);font:44px 'Great Vibes';color:#6e5220;cursor:pointer;transition:opacity .4s,transform .4s;animation:sb 2.4s ease-in-out infinite}
@keyframes sb{50%{transform:scale(1.06)}}
.env .seal:after{content:'';position:absolute;inset:11px;border-radius:50%;border:1.5px solid rgba(110,82,32,.45)}
.open .seal{opacity:0;transform:scale(.6);animation:none}.open .flap{transform:rotateX(180deg);z-index:0}.open .letter{transform:translateY(-62%)}
.envS .eu1{position:absolute;width:44%;left:-8%;top:62%;transform:rotate(-25deg);pointer-events:none}
.envS .eu2{position:absolute;width:40%;right:-8%;top:24%;transform:rotate(150deg);pointer-events:none}
.envS .tap{position:absolute;top:82%;left:0;right:0;text-align:center;font-size:14px;color:var(--sub);letter-spacing:.04em}
.inv{display:none}.inv.show{display:block;animation:fi 1s ease}@keyframes fi{from{opacity:0;transform:translateY(16px)}}
/* hero A */
.heroA{position:relative;height:100vh;min-height:640px;max-height:860px;overflow:hidden}.scr .heroA{height:716px;min-height:0}
.heroA .pic{position:absolute;inset:0 0 auto 0;height:62%;background-size:cover;background-position:center 22%}
.heroA .pic.none{background:var(--bg);display:flex;align-items:center;justify-content:center}.heroA .pic.none img{width:55%}
.heroA .blk{position:absolute;left:0;right:0;bottom:0;height:43%;background:var(--blk);color:#fff;text-align:center;padding-top:16px}
.heroA .wave{position:absolute;top:-33px;left:0;right:0;height:34px;color:var(--blk)}.heroA .wave svg{width:100%;height:100%;display:block}
.heroA .k{font:600 11px 'DM Sans';letter-spacing:.32em;margin-top:6px}
.heroA .s{font:62px/1.05 'Great Vibes';margin:4px 0 0}
.fish{display:flex;justify-content:center;margin:2px 0}
.heroA .n{font:500 30px 'Cormorant Garamond';letter-spacing:.04em}
.heroA .d{font:500 14px 'DM Sans';letter-spacing:.16em;margin-top:8px;padding:0 20px}
/* hero B */
.heroB{text-align:center;padding:52px 0 10px}
.heroB .k{font:600 11px 'DM Sans';letter-spacing:.28em;color:var(--sub);padding:0 24px}
.heroB .arch{width:220px;height:270px;margin:16px auto 0;border-radius:110px 110px 14px 14px;background-size:cover;background-position:center 30%;box-shadow:0 0 0 6px #fff,0 8px 20px rgba(0,0,0,.08)}
.heroB .archDove{display:block;width:200px;margin:20px auto 0}
.heroB .wr{position:relative;width:300px;height:250px;margin:-22px auto 0}
.heroB .wr img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.gold{background:linear-gradient(100deg,#a8823c,#e2c47d 45%,#b08a43 70%,#d8b86c);-webkit-background-clip:text;background-clip:text;color:transparent}
.heroB .nm{position:absolute;left:0;right:0;top:76px;font:74px/1.1 'Great Vibes'}
.heroB .tf{position:absolute;left:0;right:0;top:166px;font:500 14px 'DM Sans';letter-spacing:.24em}
.heroB .dd{font:500 19px 'Cormorant Garamond';margin-top:0}
/* body */
.ibody{padding:22px 20px 40px}
.verse{text-align:center;font:italic 500 20px/1.4 'Cormorant Garamond';color:var(--ink);margin:6px 10px 18px}.verse small{display:block;font:600 11px 'DM Sans';letter-spacing:.18em;color:var(--sub);margin-top:6px;font-style:normal}
.cd{display:flex;gap:8px;justify-content:center;margin:0 0 16px}
.cd div{background:#fff;border-radius:16px;width:74px;padding:9px 0 7px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.cd b{display:block;font:600 26px 'Cormorant Garamond';color:var(--acc)}.cd span{font-size:10px;color:var(--sub);letter-spacing:.08em}
.card{background:#fff;border-radius:22px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.ct{font:600 11px 'DM Sans';letter-spacing:.2em;color:var(--sub);margin-bottom:6px}
.pt{font:500 21px 'Cormorant Garamond'}.pa{font-size:14px;color:var(--sub);margin-top:2px}
.btn{display:inline-block;border:0;border-radius:30px;padding:11px 18px;font:600 14px 'DM Sans';background:var(--acc);color:#fff;margin:10px 6px 0 0;text-decoration:none;cursor:pointer}
.btn.o{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}.btn.sm{padding:8px 14px;font-size:13px}
.row{display:flex;flex-wrap:wrap;align-items:center}.row.c{justify-content:center;margin:-4px 0 12px}
.cand{display:flex;gap:16px;align-items:center;cursor:pointer}.cand p{font:500 18px/1.3 'Cormorant Garamond'}
.cd-ico{flex:none}.cd-ico .flame{opacity:0;transition:opacity .8s;transform-origin:27px 30px}
.lit .cd-ico .flame{opacity:1;animation:fl 1.6s ease-in-out infinite}@keyframes fl{50%{transform:scale(1.04,.95) rotate(1.5deg)}}
.candle .more{max-height:0;overflow:hidden;transition:max-height .8s}.candle.lit .more{max-height:300px}
.candle .cd-ico:not(.x){animation:hint 2.5s ease-in-out infinite}.candle.lit .cd-ico{animation:none}@keyframes hint{50%{transform:translateY(-3px)}}
textarea,.rsvp input{width:100%;border:1px solid #e3e5df;border-radius:12px;padding:10px 12px;margin-top:10px;font:italic 500 16px 'Cormorant Garamond';background:#fff;resize:vertical}
.rsvp input{font:500 15px 'DM Sans'}
.step,.fc{display:flex;align-items:center;gap:10px;margin-top:10px}.step span,.fc span{flex:1;font-size:14.5px}.step b,.fc b{width:24px;text-align:center}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
