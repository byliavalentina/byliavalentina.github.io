*{box-sizing:border-box;margin:0;padding:0}
:root{--bg1:#0b1430;--bg2:#1c2a58;--gold:#d9b56b;--gold2:#f3dfaa;--ink:#f6eedc;--mute:rgba(246,238,220,.62);--card:rgba(255,255,255,.06);--line:rgba(217,181,107,.32)}
body.t-champ{--bg1:#11100e;--bg2:#2b2520;--gold:#e3c48a;--gold2:#f7e6c2}
body.t-bord{--bg1:#1c0910;--bg2:#431326;--gold:#e2b66e;--gold2:#f6dca6}
html,body{height:100%}
body{font-feature-settings:'lnum' 1;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg1) 70%) fixed;background-color:var(--bg1);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
.serif{font-family:'Cormorant Garamond',serif}
/* ---------- Einrichtung ---------- */
.setup{max-width:860px;margin:0 auto;padding:46px 20px 140px}
.brand{text-align:center;margin-bottom:34px}
.brand .k{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.brand h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(38px,7vw,62px);line-height:1.02;margin:10px 0 8px}
.brand h1 i{font-family:'Great Vibes',cursive;font-style:normal;font-weight:400;color:var(--gold);font-size:1.12em}
.brand p{color:var(--mute);font-size:16px;max-width:520px;margin:0 auto}
.sec{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 24px 22px;margin:18px 0;backdrop-filter:blur(6px)}
.sec h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;display:flex;align-items:center;gap:12px;margin-bottom:4px}
.sec h2 .n{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:'DM Sans';font-size:14px;font-weight:600;flex:none}
.sec .hint{color:var(--mute);font-size:14px;margin:0 0 16px 42px}
.row{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:640px){.row{grid-template-columns:1fr}.sec .hint{margin-left:0}}
label.f{display:block}
label.f span{display:block;font-size:13px;color:var(--mute);margin-bottom:6px;letter-spacing:.02em}
.inp{width:100%;background:rgba(0,0,0,.22);border:1px solid rgba(246,238,220,.16);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;transition:border .2s}
.inp:focus{border-color:var(--gold)}
textarea.inp{min-height:170px;resize:vertical;line-height:1.5}
.themes{display:flex;gap:12px;flex-wrap:wrap}
.th{flex:1;min-width:150px;border-radius:14px;padding:14px;border:1px solid rgba(246,238,220,.16);cursor:pointer;text-align:left;background:none}
.th b{display:block;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600}
.th small{color:var(--mute);font-size:12px}
.th .sw{height:34px;border-radius:9px;margin-bottom:10px}
.th.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#000}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:15px;line-height:1}
.add{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);border-radius:14px;padding:18px;cursor:pointer;color:var(--gold);font-weight:600}
.add:hover{background:rgba(217,181,107,.07)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid rgba(246,238,220,.18);background:none;border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14px}
.tab.on{background:var(--gold);color:#1a1410;border-color:var(--gold);font-weight:600}
.cnt{font-size:12px;color:var(--mute);margin-top:6px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;margin-top:12px}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.55) 35%);display:flex;justify-content:center;gap:12px;flex-wrap:wrap;z-index:5}
.btn{border:0;border-radius:99px;padding:15px 26px;font-weight:600;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:9px}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1410;box-shadow:0 8px 30px rgba(217,181,107,.28)}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink)}
.btn:active{transform:scale(.98)}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:26px;line-height:1.6}
.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-20px);opacity:0;background:#000c;padding:12px 18px;border-radius:12px;font-size:14px;transition:.3s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
/* ---------- Show ---------- */
.show{position:fixed;inset:0;overflow:hidden;cursor:default}
.show.idle{cursor:none}
#stars,#fx,#cf{position:absolute;inset:0;width:100%;height:100%}
#fx,#cf{pointer-events:none;z-index:6}
.blurbg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) brightness(.5) saturate(1.05);opacity:0;transition:opacity 1.6s}
.blurbg.on{opacity:.38}
.stage{position:absolute;inset:0;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:4vw;padding:6vh 6vw;z-index:2}
.stage.nophotos{grid-template-columns:1fr;text-align:center}
.stage.nophotos .frame{display:none}
.frame{position:relative;height:74vh;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);border:1px solid var(--line);background:#000}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.frame img.on{opacity:1;animation:kb 12s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.side{display:flex;flex-direction:column;gap:3.2vh;min-width:0}
.stage.nophotos .side{align-items:center}
.pname{font-family:'Great Vibes',cursive;color:var(--gold);font-size:clamp(34px,5.6vw,92px);line-height:1}
.psub{font-size:clamp(13px,1.25vw,20px);letter-spacing:.34em;text-transform:uppercase;color:var(--mute);margin-top:.6vh}
.clock{display:flex;gap:1.6vw;align-items:flex-start}
.stage.nophotos .clock{justify-content:center}
.unit{display:flex;flex-direction:column;align-items:center}
.stage.photos .unit .v{font-size:clamp(38px,5.4vw,104px)}
.stage.photos .sep{font-size:clamp(34px,4.4vw,84px)}
.unit .v{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(46px,7.4vw,140px);line-height:.95;color:var(--ink);display:flex}
.unit .v span{display:inline-block;width:.56em;text-align:center}
.unit .l{font-size:clamp(10px,.95vw,15px);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-top:1vh}
.sep{font-family:'Cormorant Garamond',serif;font-size:clamp(40px,6vw,110px);line-height:.95;color:var(--gold);opacity:.55}
.tick{position:relative;min-height:22vh}
.card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:1.4vh;opacity:0;transform:translateY(14px);transition:opacity 1s,transform 1s}
