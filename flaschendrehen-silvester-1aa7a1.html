*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg1:#0c1430;--bg2:#1d2a5a;--gold:#dcb76e;--gold2:#f4e1ad;--ink:#f7efdf;--mute:rgba(247,239,223,.62);--line:rgba(220,183,110,.3);--card:rgba(255,255,255,.06);
--cw:#7fa0d8;--cp:#e07a6b;--cr:#8cc7a4;--cv:#e6c46b}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:radial-gradient(130% 90% at 50% 0%,var(--bg2),var(--bg1) 70%) fixed;background-color:var(--bg1);overflow-x:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea{font:inherit;color:inherit}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 18px 120px;min-height:100%}
.k{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
h1.t{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(34px,9vw,48px);line-height:1.02;margin:8px 0 6px;text-align:center}
h1.t i{font-family:'Great Vibes',cursive;font-style:normal;font-weight:400;color:var(--gold);font-size:1.15em}
.sub{color:var(--mute);text-align:center;font-size:15px;max-width:400px;margin:0 auto}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px;backdrop-filter:blur(6px)}
.sec h2{font-family:'Fraunces',serif;font-weight:600;font-size:21px;margin-bottom:4px}
.sec p.h{color:var(--mute);font-size:13.5px;margin-bottom:12px}
.pl{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);border:1px solid rgba(247,239,223,.14);border-radius:99px;padding:8px 8px 8px 14px;font-size:15px}
.chip b{font-weight:600}
.chip button{border:0;background:rgba(0,0,0,.3);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1}
.add{display:flex;gap:8px;margin-top:12px}
.inp{flex:1;width:100%;background:rgba(0,0,0,.25);border:1px solid rgba(247,239,223,.16);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--gold)}
.btn{border:0;border-radius:99px;padding:13px 20px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1d160c;box-shadow:0 10px 30px rgba(220,183,110,.25)}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink)}
.btn:active{transform:scale(.97)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:1px solid rgba(247,239,223,.16);background:none;border-radius:16px;padding:14px 8px;cursor:pointer;text-align:center}
.mode .e{font-size:26px;display:block;margin-bottom:4px}
.mode b{display:block;font-size:15px}
.mode small{color:var(--mute);font-size:11.5px;line-height:1.3;display:block;margin-top:3px}
.mode.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;background:rgba(220,183,110,.08)}
