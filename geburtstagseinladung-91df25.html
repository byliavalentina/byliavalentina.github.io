*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f1ede7;color:#2e2a27;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.gwrap,.scr{background:var(--bg);color:var(--ink);min-height:100%;position:relative;overflow-x:hidden}.gwrap{min-height:100vh}
.gv{max-width:480px;margin:0 auto;position:relative;min-height:100%;text-align:center}
.mus{position:absolute;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#2e2a27;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.2);cursor:pointer}.mus.on{background:var(--acc);color:#1e1f22}
.phone .gv .mus{top:40px}
.lights{position:absolute;top:0;left:0;right:0;height:70px;z-index:3;pointer-events:none}.lights svg{width:100%;height:100%}
.bulb{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.55}}
/* envelope */
.envS{position:relative;height:100vh;min-height:620px;max-height:900px;overflow:hidden;cursor:pointer;background:var(--bg)}.scr .envS{height:716px;min-height:0}.envS.gone{display:none}
.envS .eh{position:absolute;top:21%;left:0;right:0;font:500 46px/1.1 'Caveat';color:var(--acc);padding:0 20px}
.th-sage .envS .eh{font:46px 'Great Vibes'}
.env{position:absolute;left:10%;right:10%;top:40%;aspect-ratio:1.5;perspective:900px}
.env .back{position:absolute;inset:0;background:#2a2c30;border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.env .letter{position:absolute;left:6%;right:6%;top:8%;height:86%;background:#f8f5ee;border-radius:3px;display:flex;justify-content:center;padding-top:10%;font:500 54px 'Cormorant Garamond';color:#b08a43;transition:transform 1s .5s cubic-bezier(.3,.6,.3,1)}
.env .front{position:absolute;inset:0;background:#2e3035;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:6px}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;background:#36393e;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s}
.th-sage .env .back{background:#c9d3c3;box-shadow:0 16px 30px rgba(60,70,55,.2)}.th-sage .env .front{background:#d3dccd}.th-sage .env .flap{background:#dde5d8}
.env .seal{position:absolute;left:50%;top:62%;width:88px;height:88px;margin:-44px 0 0 -44px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efd796,#b8913f 60%,#8f6c2c);box-shadow:0 4px 10px rgba(0,0,0,.4);font:600 30px 'Cormorant Garamond';color:#6e5220;cursor:pointer;animation:sb 2.4s ease-in-out infinite;transition:opacity .4s}
.env .seal:after{content:'';position:absolute;inset:11px;border-radius:50%;border:1.5px solid rgba(110,82,32,.45)}@keyframes sb{50%{transform:scale(1.06)}}
.open .seal{opacity:0;animation:none}.open .flap{transform:rotateX(180deg)}.open .letter{transform:translateY(-60%)}
.envS .tap{position:absolute;top:82%;left:0;right:0;font-size:14px;color:var(--sub)}
.envS .tw1,.heroS .tw1{position:absolute;width:210px;left:-90px;top:-50px;transform:rotate(30deg);pointer-events:none}
.inv{display:none}.inv.show{display:block;animation:fi 1s}@keyframes fi{from{opacity:0;transform:translateY(14px)}}
/* heroes */
.heroD{position:relative;height:100vh;min-height:640px;max-height:860px;overflow:hidden}.scr .heroD{height:716px;min-height:0}
.heroD .pic{position:absolute;left:0;right:0;top:36px;height:66%;background-size:cover;background-position:center 20%;-webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}
.heroD .tx{position:absolute;left:22px;right:22px;top:62%;font:500 44px/1.0 'Caveat';color:#fff}.heroD .tx b{display:block;font:500 80px/0.95 'Caveat';color:var(--acc);font-weight:normal}
.heroD .sub{position:absolute;left:0;right:0;bottom:46px;font:600 12px 'DM Sans';letter-spacing:.28em;color:#bdb8ad}
.heroS{position:relative;overflow:hidden;padding:84px 0 30px}
.heroS .tw2{position:absolute;width:180px;right:-100px;top:560px;transform:rotate(200deg);pointer-events:none}
.heroS .iw{font:50px 'Great Vibes';color:var(--acc)}.heroS .num{font:300 190px/0.85 'Cormorant Garamond';color:var(--acc);letter-spacing:-.04em}
.heroS .ring{width:160px;height:160px;border-radius:50%;margin:-12px auto 0;border:6px solid #fff;background-size:cover;background-position:center 25%;box-shadow:0 8px 20px rgba(0,0,0,.12);position:relative}
.heroS .t1{font:600 12px 'DM Sans';letter-spacing:.26em;color:var(--sub);margin-top:22px;padding:0 20px}.heroS .t2{font:500 32px 'Cormorant Garamond';margin-top:6px}.heroS .t3{font:italic 500 18px 'Cormorant Garamond';color:var(--sub);margin-top:10px}
/* body */
.ibody{padding:20px 20px 40px}
.card{background:var(--card);color:var(--cardInk);border-radius:22px;padding:16px 18px;margin-bottom:12px;text-align:left;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ct{font:600 11px 'DM Sans';letter-spacing:.2em;color:var(--sub);margin-bottom:8px}
.letterC{background:#f8f5ee;color:#3a3631}.letter{font:500 23px/1.28 'Caveat';white-space:pre-line}.letter.sig{text-align:right;margin-top:6px}
.itx{font:500 19px/1.5 'Cormorant Garamond';margin:10px 6px 20px}.th-dark .itx{font:500 25px/1.3 'Caveat'}
.guess{padding:20px 0 10px}.guess .q{font:500 40px/1.05 'Caveat';color:var(--ink)}.th-sage .guess .q{font:40px/1.1 'Great Vibes';color:var(--acc)}.guess .q2{font-size:14px;color:var(--sub);margin-top:8px}
.opts{display:flex;justify-content:center;gap:8px;margin-top:18px}.opts span{border:1.5px solid var(--line);border-radius:22px;padding:9px 16px;font:600 15px 'DM Sans';cursor:pointer;min-width:60px}.opts span.on{background:var(--acc);border-color:var(--acc);color:#1e1f22}.th-sage .opts span.on{color:#fff}
.coin{position:relative;width:230px;height:230px;border-radius:50%;margin:22px auto 0;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.2)}
.coin span{font:300 130px 'Cormorant Garamond';color:var(--acc)}.foil{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.res{font:600 16px 'DM Sans';color:var(--acc);margin-top:14px;min-height:22px}
.then{padding:24px 0 10px}.then .k{font:600 12px 'DM Sans';letter-spacing:.26em;color:var(--sub)}.then .hd{font:42px 'Great Vibes';color:var(--acc);margin-top:4px}.th-dark .then .hd{font:500 42px 'Caveat'}
.cmp{position:relative;width:300px;height:360px;margin:16px auto 0;border-radius:20px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.15);touch-action:none;cursor:ew-resize;user-select:none}
.cmp div{position:absolute;inset:0;background-size:cover;background-position:center 25%}.cmp i{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#fff}
.cmp i:after{content:'⟷';position:absolute;top:50%;left:-19px;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:#fff;color:#6f8a69;font:600 18px 'DM Sans';display:flex;align-items:center;justify-content:center;font-style:normal;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.cmp span{position:absolute;bottom:12px;font:600 11px 'DM Sans';letter-spacing:.2em;color:#fff;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:10px}.cmp .l{left:12px}.cmp .r{right:12px}
.cap2{font:italic 500 18px 'Cormorant Garamond';margin:14px 30px 0}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;

          if (_this.isDark(r, c) ) {

            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

function qrCanvas(url,ink,title,sub,hf){const q=qrcode(0,'M');q.addData(url);q.make();const n=q.getModuleCount(),s=Math.max(3,Math.floor(560/(n+8)));const cv=h('canvas',{width:(n+8)*s,height:(n+8)*s+110,class:'qr'});const x=cv.getContext('2d');const draw=()=>{x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.fillStyle=ink;for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect((c+4)*s,(r+4)*s,s,s);x.textAlign='center';x.font=`44px ${hf}`;x.fillText(title,cv.width/2,(n+8)*s+46);x.font=`24px 'DM Sans',sans-serif`;x.fillStyle='#777';x.fillText(sub,cv.width/2,(n+8)*s+88)};draw();document.fonts.ready.then(draw);return cv}
