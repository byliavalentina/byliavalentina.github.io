:root{--bg:#ece6db;--panel:#fbf8f2;--line:#e2dacb;--ink:#3b3a36;--mute:#8a8478;--sage-l:#e3e9da;--terra:#c47c5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:grid;grid-template-columns:1fr 400px;height:100%}
.stage{display:grid;place-items:center;padding:20px;min-height:0;position:relative}
.phone{position:relative;height:min(88vh,860px);aspect-ratio:9/16;border-radius:44px;background:#151515;padding:12px;box-shadow:0 30px 70px rgba(40,30,15,.28)}
.screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:#000}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.acts{position:absolute;left:0;right:0;bottom:0;padding:0 5% 4%;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s}
.acts.on{opacity:1;pointer-events:auto}
.acts button,.acts a{flex:1 1 28%;text-align:center;text-decoration:none;padding:10px 6px;border-radius:999px;font-weight:600;font-size:clamp(11px,1.6vh,14px);backdrop-filter:blur(6px);white-space:nowrap}
.acts .pri{flex-basis:100%}
.replay{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(6px);opacity:0;transition:opacity .4s}
.replay.on{opacity:1}
.replay svg{width:16px;height:16px}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:22px 22px 60px}
.panel h1{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:28px;margin:0 0 2px}
.panel .sub{color:var(--mute);margin:0 0 16px;line-height:1.5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lang{font-weight:600;font-size:12px;letter-spacing:.05em;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px;font-weight:600}
label{display:block;font-size:12.5px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#b9ae99}
textarea{resize:vertical;min-height:58px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.th{aspect-ratio:9/13;border-radius:10px;border:2px solid transparent;position:relative;overflow:hidden}
.th.on{border-color:var(--ink)}
.th i{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.thn{font-size:11px;text-align:center;color:var(--mute);margin-top:3px}
.occ{display:flex;flex-wrap:wrap;gap:6px}
.occ button{padding:8px 11px;border-radius:999px;background:#f1ece2;font-weight:600;font-size:12.5px}
.occ button.on{background:var(--ink);color:#fff}
.big{display:flex;gap:10px;align-items:center;width:100%;padding:13px 14px;border-radius:12px;background:#f1ece2;text-align:left;font-weight:600;margin-bottom:8px}
.big:hover{background:#e9e2d5}
.big.dark{background:var(--ink);color:#fff}
.big small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:2px}
.big svg{width:20px;height:20px;flex:none}
.hint{font-size:12px;color:var(--mute);line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(40,35,25,.4);display:none;place-items:center;z-index:50;padding:16px}
.modal.show{display:grid}
.card{background:var(--panel);border-radius:18px;max-width:460px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.card h2{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:26px;margin:0 0 6px}
.card p{color:#6b665c;line-height:1.55}
.prog{height:8px;border-radius:9px;background:#eee7da;overflow:hidden;margin:14px 0}.prog i{display:block;height:100%;width:0;background:#7d8f6e}
.cta{padding:12px 18px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600}
.linkbox{width:100%;font-size:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;word-break:break-all;max-height:90px;overflow:auto;margin:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:200;pointer-events:none;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%)}
.guest .app{grid-template-columns:1fr}.guest .panel{display:none}
.guest .stage{padding:0}
.guest .phone{height:100%;max-height:none;aspect-ratio:auto;width:100%;border-radius:0;padding:0;background:#000;box-shadow:none}
.guest .screen{border-radius:0}
@media (min-width:700px){.guest .phone{width:auto;aspect-ratio:9/16;height:100vh}}
@media (max-width:900px){
 .app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto}
 html,body{height:auto}
 .stage{padding:14px}
 .phone{height:min(78vh,720px)}
 .panel{border-left:0;border-top:1px solid var(--line)}
}
body.guest{height:100dvh;overflow:hidden}body.guest .app{display:block;height:100dvh}body.guest .stage{height:100dvh;padding:0}body.guest .phone{height:100dvh;width:100%;max-height:none;aspect-ratio:auto;border-radius:0;padding:0;box-shadow:none}
@media (min-width:700px){body.guest .phone{width:auto;aspect-ratio:9/16;margin:0 auto}}

#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;font-family:'DM Sans',sans-serif;color:var(--ink)}
#view .hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#view .hearts i{position:absolute;bottom:-30px;color:var(--acc);opacity:.13;font-style:normal;animation:fl linear infinite}
#view.dark .hearts i{color:#fff;opacity:.12}
@keyframes fl{to{transform:translateY(-110vh) rotate(25deg)}}
#view .hd{position:relative;text-align:center;padding:9% 6% 3%}
#view h1{font:400 clamp(40px,12vw,64px)/1.05 'Great Vibes',cursive;color:var(--acc);margin:0}
#view .hd p{font:500 clamp(18px,5vw,24px) 'Caveat',cursive;color:var(--sub);margin:4px 0 0}
#view.dark h1{color:#fff}
#view .grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4%;padding:2% 6% 4%}
#view .env{position:relative;aspect-ratio:1.3;border-radius:10px;background:var(--env);box-shadow:0 8px 18px rgba(80,30,40,.16);overflow:hidden;border:0;padding:0;cursor:pointer;transition:transform .2s}
#view .env:active{transform:scale(.97)}
#view .flap{position:absolute;left:0;right:0;top:0;height:52%;background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%)}
#view .seal{position:absolute;left:50%;top:52%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--seal) 70%,#fff),var(--seal));color:rgba(255,255,255,.75);display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.2)}
#view .seal svg{width:15px;height:15px}
#view .lbl{position:absolute;left:6%;right:6%;bottom:7%;font:500 clamp(14px,4.2vw,19px)/1.05 'Caveat',cursive;color:#5a3a3a;text-align:center}
#view .env.lock{filter:saturate(.35);opacity:.85}
#view .env.lock .seal{background:#9b8c8a}
#view .env.open{background:color-mix(in srgb,var(--env) 40%,#fff)}
#view .env.open .flap{opacity:.45}
#view .tag{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);border-radius:99px;padding:2px 8px;font:600 11px 'DM Sans',sans-serif;color:#7a6060}
#view .tag.ok{color:#4c7a5a}
#view .shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#view .foot{position:relative;text-align:center;font:600 13px 'DM Sans',sans-serif;color:var(--sub);opacity:.8;margin:2% 0 8%}
#view .ov{position:absolute;inset:0;z-index:20;background:rgba(40,20,25,.35);backdrop-filter:blur(3px);overflow:hidden;transition:opacity .35s}
#view .ov.out{opacity:0}
#view .bigenv{position:absolute;left:5%;right:5%;bottom:0;height:34%;perspective:900px}
#view .bigenv>*{position:absolute}
#view .back{inset:0;background:var(--flap);border-radius:12px 12px 0 0;z-index:1}
#view .front{inset:0;background:var(--env);border-radius:12px 12px 0 0;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);z-index:3;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#view .topflap{left:0;right:0;top:0;height:58%;background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4;filter:brightness(1.03)}
#view .seal2{left:50%;top:58%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--seal) 65%,#fff),var(--seal));color:rgba(255,255,255,.8);display:grid;place-items:center;z-index:5;box-shadow:0 4px 8px rgba(0,0,0,.25)}
#view .seal2 svg{width:26px;height:26px}
#view .paper{left:4%;right:4%;bottom:14%;height:235%;z-index:2;background:var(--paper);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);transform:translateY(68%);overflow-y:auto;padding:9% 9% 7%;text-align:center}
#view .ov.go .topflap{transform:rotateX(180deg);z-index:0;transition:transform .6s ease,z-index 0s .3s}
#view .ov.go .seal2{opacity:0;transform:scale(1.4);transition:.35s}
#view .ov.go .paper{transform:translateY(0);z-index:6;transition:transform .9s cubic-bezier(.2,.8,.2,1) .55s,z-index 0s 1.1s}
#view .ov.go .back,#view .ov.go .front,#view .ov.go .topflap{opacity:0;transition:transform .6s ease,z-index 0s .3s,opacity .5s 1.3s}
#view .ov.done *{transition:none!important}
#view .paper img{width:30%;max-width:120px;display:block;margin:0 auto 4px}
#view .when{font:600 12px 'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);opacity:.8}
#view .paper h2{font:600 clamp(20px,6vw,28px)/1.15 'Fraunces',serif;color:var(--acc);margin:4px 0 14px;text-wrap:balance}
#view .txt{text-align:left}
#view .txt p{font:500 clamp(20px,5.8vw,27px)/1.25 'Caveat',cursive;color:var(--ink);margin:0 0 10px}
#view .sig{margin-top:16px;text-align:right}
#view .sig span{display:block;font:500 20px 'Caveat',cursive;color:#8a6a66}
#view .sig b{font:400 clamp(34px,10vw,46px)/1 'Great Vibes',cursive;color:var(--acc);font-weight:400}
#view .backbtn{position:absolute;top:2.5%;left:50%;transform:translateX(-50%);z-index:8;background:rgba(255,255,255,.95);border:0;border-radius:99px;padding:10px 18px;font:600 14px 'DM Sans',sans-serif;color:#5a3a3a;box-shadow:0 4px 12px rgba(0,0,0,.15);white-space:nowrap;cursor:pointer}
.lt{border:1px solid #eadfd2;border-radius:12px;margin-bottom:8px;background:#fff;overflow:hidden}
.lth{display:flex;gap:8px;align-items:center;padding:12px 14px;cursor:pointer;font-size:14px}
.lth b{color:#b23a4c}
.lth span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Caveat',cursive;font-size:20px}
.ltb{display:none;padding:0 14px 14px}
.lt.on .ltb{display:block}
.lt.on{border-color:#b23a4c}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px}
.icb{aspect-ratio:1;border-radius:10px;background:#f6eee9;padding:4px;border:2px solid transparent}
.icb img{width:100%;height:100%;object-fit:contain}
.icb.on{border-color:#b23a4c;background:#fff}
.ltact{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.ltact button{padding:8px 14px;border-radius:10px;border:1px solid #e2dacb;font-weight:600;font-size:13px}
.ltact .del{color:#b23a4c}
.add{width:100%;padding:14px;border-radius:12px;border:2px dashed #d9c3bf;font-weight:600;color:#b23a4c;margin-top:4px;background:none}

#view .pol{width:58%;max-width:220px;margin:0 auto 10px;background:#fff;padding:7px 7px 6px;box-shadow:0 6px 16px rgba(0,0,0,.18);transform:rotate(-3deg)}
#view .paper .pol img{width:100%;max-width:none;aspect-ratio:1;object-fit:cover;display:block;margin:0}
#view .pol span{display:block;text-align:center;font:500 20px 'Caveat',cursive;color:#3e2a2a;margin-top:4px}
#view.vint{background-image:radial-gradient(rgba(0,0,0,.06) 1px,transparent 1px)!important;background-size:3px 3px!important;background-color:#f4efe4!important}
#view.vint h1{font:700 italic clamp(38px,11vw,56px)/1 'Playfair Display',serif;color:var(--ink)}
#view.vint .hd p{font:400 clamp(11px,3.2vw,14px) 'Special Elite',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
#view.vint .hd{border-bottom:3px double var(--ink);margin:0 6%;padding-bottom:3%}
#view.vint .env{border-radius:2px;border:1px solid #d8ccb4;box-shadow:0 4px 10px rgba(60,40,20,.12)}
#view.vint .seal{top:42%;font:700 italic 15px 'Playfair Display',serif;color:#e6c9b5;background:radial-gradient(circle at 35% 35%,#8e3238,#3e1416)}
#view.vint .lbl{bottom:5%;font:400 clamp(10px,3vw,13px)/1.1 'Special Elite',monospace;color:#2b2621}
#view.vint .stamp{position:absolute;top:6px;left:6px;width:32px;height:38px;border:2px dotted #b9a98c;background:#fbf6ea;display:grid;place-items:center;font:400 10px 'Special Elite',monospace;color:#6e2328}
#view.vint .env.lock{filter:none;opacity:.6}
#view.vint .tag{font-family:'Special Elite',monospace;border-radius:2px}
#view.vint .foot{font-family:'Special Elite',monospace;letter-spacing:.08em}
#view.vint .paper{border-radius:2px;background:#fbf8f1;transform-origin:center}
#view.vint .when{font:400 12px 'Special Elite',monospace;color:var(--acc)}
#view.vint .paper h2{font:700 italic clamp(22px,6.5vw,30px)/1.1 'Playfair Display',serif;color:var(--ink)}
#view.vint .txt p{font:500 italic clamp(21px,6vw,26px)/1.28 'Cormorant Garamond',serif;color:var(--ink)}
#view.vint .sig span{font:500 italic 19px 'Cormorant Garamond',serif;color:var(--sub)}
#view.vint .sig b{font:500 italic clamp(28px,8vw,36px)/1 'Cormorant Garamond',serif;color:var(--ink)}
#view.vint .pol img{filter:grayscale(1) contrast(1.05)}
#view.vint .pol span{font:500 italic 17px 'Cormorant Garamond',serif}
#view.vint .backbtn{border-radius:2px;font-family:'Special Elite',monospace;background:#1d1a17;color:#f4efe4}
#view.vint .seal2{background:radial-gradient(circle at 35% 35%,#8e3238,#3e1416)}

</style>
</head>

const SAMPLES={de:[
['… du mich vermisst','v_brief','Ich vermisse dich gerade bestimmt genauso.\nMach die Augen zu und denk an unseren letzten Abend zusammen. Ich bin näher, als es sich anfühlt, und bald sind wir wieder zusammen.'],
['… du nicht schlafen kannst','v_kaffee','Hey, du Nachteule.\nAtme einmal tief durch. Morgen wird gut, und wenn nicht, machen wir es uns trotzdem schön. Ich halte dich gedanklich ganz fest.'],
['… du einen schlechten Tag hattest','v_herzen','Heute war nicht dein Tag, und das ist okay.\nDu musst nicht immer stark sein. Ich bin stolz auf dich, auch an Tagen wie diesem. Ruf mich an, ich hör dir zu.'],
['… wir gestritten haben','v_schluessel','Ich bin wahrscheinlich gerade auch noch ein bisschen sauer.\nAber eins weiß ich sicher: Ich will mit dir streiten statt mit irgendwem sonst glücklich sein. Lass uns reden.'],
['… du lachen willst','v_kino','Erinnerst du dich an den Abend, an dem wir vor Lachen nicht mehr konnten?\nGenau dieses Gefühl schicke ich dir hiermit. Jetzt bist du dran: Erzähl mir den schlechtesten Witz, den du kennst.'],
['… du an dir zweifelst','v_rose','Du bist klüger, mutiger und liebenswerter, als du gerade glaubst.\nIch sehe jeden Tag, was du alles schaffst. Vertrau mir, ich kenne dich ziemlich gut.'],
['… du Fernweh hast','v_ballon','Pack schon mal gedanklich die Koffer.\nIrgendwann stehen wir zusammen an einem Ort, den wir beide noch nicht kennen. Bis dahin: Wohin würdest du als Erstes mit mir fliegen?'],
['… es regnet und dir langweilig ist','v_polaroid','Perfektes Wetter für eine Decke, Tee und einen Film.\nUnd wenn ich gerade nicht da bin: Such dir ein altes Foto von uns raus und schick es mir.'],
['… du krank im Bett liegst','v_kaffee','Gute Besserung, mein Herz.\nTrink genug, schlaf viel und lass dich verwöhnen. Ich koche dir Suppe, sobald ich kann.'],
['… du stolz auf dich bist','v_herzen','Ich bin es auch!\nDu hast es dir verdient. Heute feiern wir dich, und ich lade dich ein, wohin du willst.'],
['… unser Jahrestag ist','v_ring','Noch ein Jahr mit dir, und ich würde jedes davon wieder genauso wählen.\nDanke für jeden Tag. Auf viele weitere.'],
['… du wissen willst, wie sehr ich dich liebe','v_glas','So sehr, dass mir kein Brief der Welt dafür reicht.\nAber ich versuche es trotzdem jeden Tag ein bisschen. Ich liebe dich.']],
en:[
['… you miss me','v_brief',"I'm probably missing you just as much right now.\nClose your eyes and think of our last evening together. I'm closer than it feels, and we'll be together again soon."],
["… you can't sleep",'v_kaffee',"Hey, night owl.\nTake a deep breath. Tomorrow will be good, and if not, we'll make it nice anyway. I'm holding you tight in my thoughts."],
