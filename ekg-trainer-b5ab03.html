:root{--bg:#f3f5f3;--card:#fff;--line:#e1e6e2;--ink:#24312e;--mute:#6f7d78;--acc:#2f6b63;--acc-l:#e3efec;--bad:#c0674b;--bad-l:#f8ebe5;--ok:#5b8a57;--ok-l:#e9f2e6;--info:#4f6e95;--info-l:#e8eef6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15.5px;line-height:1.5}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--acc);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:26px;height:26px}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:25px;margin:0;letter-spacing:-.01em}
.tag{color:var(--mute);font-size:13px;margin-top:1px}
.lang{font-weight:600;font-size:12px;letter-spacing:.05em;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff}
nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#e7ece8;box-shadow:0 -10px 0 10px var(--bg);padding:5px;border-radius:14px;margin-bottom:16px;position:sticky;top:8px;z-index:5}
nav button{padding:10px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute)}
nav button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h2{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:0 0 10px}
h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px;font-weight:600}
h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.f label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px;gap:6px}
.f label small{font-weight:400;color:var(--mute);white-space:nowrap}
.f input{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:11px;background:#fbfcfb;outline:none;font-size:16px;font-variant-numeric:tabular-nums}
.f input:focus{border-color:var(--acc);background:#fff}
.f .rng{font-size:11.5px;color:var(--mute);margin-top:3px}
.unit{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12px;font-weight:600}
.unit button{padding:4px 10px;color:var(--mute)}.unit button.on{background:var(--acc);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.btn{padding:10px 14px;border-radius:12px;background:var(--acc-l);color:var(--acc);font-weight:600;font-size:14px}
.btn.dark{background:var(--acc);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.dx{background:var(--acc);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.dx small{opacity:.8;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.dx ul{margin:8px 0 0;padding:0;list-style:none}.dx li{font-family:'Fraunces',serif;font-size:19px;font-weight:600;line-height:1.3;margin:4px 0}
.dx li::first-letter{text-transform:uppercase}
.warn{background:#fff5e6;border:1px solid #f0d6a8;color:#7a5520;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.step:first-child{border-top:0;padding-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:var(--mute)}
.dot.bad{background:var(--bad)}.dot.ok{background:var(--ok)}.dot.info{background:var(--info)}.dot.muted{background:#c9d1cd}
.step b{display:block;font-size:13.5px;margin-bottom:2px}
.step p{margin:0;font-size:14.5px;color:#3c4a46}
.causes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cz{background:var(--bg);border-radius:12px;padding:12px 14px}
.cz b{display:block;font-size:13.5px;margin-bottom:4px}.cz ul{margin:0;padding-left:18px;font-size:13.5px;color:#3c4a46}
.empty{color:var(--mute);text-align:center;padding:26px 10px}
.disc{font-size:12px;color:var(--mute);text-align:center;margin-top:18px;line-height:1.5}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--mute);font-weight:600}
.bar{height:6px;border-radius:9px;background:#e4eae6;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s}
.story{font-size:16px;margin:0 0 14px}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.val{background:var(--bg);border-radius:12px;padding:8px 10px}.val small{display:block;font-size:11.5px;color:var(--mute);font-weight:600}.val span{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.val.hi span,.val.lo span{color:var(--bad)}.val.hi span::after{content:' ↑';font-size:14px}.val.lo span::after{content:' ↓';font-size:14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;background:#fff;font-weight:500;line-height:1.35}
.opt:hover{border-color:#b8c6c0}.opt.right{border-color:var(--ok);background:var(--ok-l)}.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.fb{margin-top:14px;border-radius:14px;padding:14px;background:var(--acc-l)}
.fb h4{margin:0 0 4px;font-family:'Fraunces',serif;font-size:18px}
.fb p{margin:0;font-size:14.5px}
details{margin-top:12px}summary{cursor:pointer;font-weight:600;color:var(--acc);font-size:14px}
.score{font-family:'Fraunces',serif;font-size:44px;font-weight:600;color:var(--acc);text-align:center;margin:10px 0 0}
/* cheat sheet */
.sheet h2{margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
td:first-child{font-weight:600;white-space:nowrap}
.formula{background:var(--bg);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
.formula b{color:var(--acc)}
ol.steps{padding-left:20px;margin:6px 0}ol.steps li{margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mn{font-size:13.5px}.mn b{color:var(--acc)}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}.causes,.two{grid-template-columns:1fr}h1{font-size:22px}.wrap{padding:12px 12px 50px}}
@media print{html,body{background:#fff!important;}body{font-size:11.5px}nav,header .lang,.noprint,.disc{display:none!important}.wrap{max-width:none;padding:0}.card{border:0;padding:0 0 8px;margin:0;break-inside:avoid}.formula,.cz{background:#f4f6f5}#calc,#quiz{display:none!important}#sheet{display:block!important}h2{font-size:15px}td,th{padding:4px 6px}@page{size:A4;margin:12mm}}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;padding:8px 2px}
.ic{display:inline-flex;align-items:center;justify-content:center}

 const N=y.length;const a=Math.max(0,Math.floor((q-0.45)*FS)),b=Math.min(N,Math.ceil((q+0.75)*FS));
 const w=o.qrsW||1,pa=o.pAmp??0.14,tA=o.tAmp??0.3,st=o.st||0,qt=o.qt||0.38;
