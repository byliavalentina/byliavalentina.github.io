:root{--bg:#f3f5f3;--card:#fff;--line:#e1e6e2;--ink:#24312e;--mute:#6f7d78;--acc:#2f6b63;--acc-l:#e3efec;--bad:#c0674b;--bad-l:#f8ebe5;--ok:#5b8a57;--ok-l:#e9f2e6;--info:#4f6e95;--info-l:#e8eef6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15.5px;line-height:1.5}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--acc);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:26px;height:26px}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:25px;margin:0;letter-spacing:-.01em}
.tag{color:var(--mute);font-size:13px;margin-top:1px}
.lang{font-weight:600;font-size:12px;letter-spacing:.05em;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#e7ece8;box-shadow:0 -10px 0 10px var(--bg);padding:5px;border-radius:14px;margin-bottom:16px;position:sticky;top:8px;z-index:5}
nav button{padding:10px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute)}
nav button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h2{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:0 0 10px}
h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px;font-weight:600}
h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.f label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px;gap:6px}
.f label small{font-weight:400;color:var(--mute);white-space:nowrap}
.f input{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:11px;background:#fbfcfb;outline:none;font-size:16px;font-variant-numeric:tabular-nums}
.f input:focus{border-color:var(--acc);background:#fff}
.f .rng{font-size:11.5px;color:var(--mute);margin-top:3px}
.unit{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12px;font-weight:600}
.unit button{padding:4px 10px;color:var(--mute)}.unit button.on{background:var(--acc);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.btn{padding:10px 14px;border-radius:12px;background:var(--acc-l);color:var(--acc);font-weight:600;font-size:14px}
.btn.dark{background:var(--acc);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.dx{background:var(--acc);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.dx small{opacity:.8;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.dx ul{margin:8px 0 0;padding:0;list-style:none}.dx li{font-family:'Fraunces',serif;font-size:19px;font-weight:600;line-height:1.3;margin:4px 0}
.dx li::first-letter{text-transform:uppercase}
.warn{background:#fff5e6;border:1px solid #f0d6a8;color:#7a5520;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.step:first-child{border-top:0;padding-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:var(--mute)}
.dot.bad{background:var(--bad)}.dot.ok{background:var(--ok)}.dot.info{background:var(--info)}.dot.muted{background:#c9d1cd}
.step b{display:block;font-size:13.5px;margin-bottom:2px}
.step p{margin:0;font-size:14.5px;color:#3c4a46}
.causes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cz{background:var(--bg);border-radius:12px;padding:12px 14px}
.cz b{display:block;font-size:13.5px;margin-bottom:4px}.cz ul{margin:0;padding-left:18px;font-size:13.5px;color:#3c4a46}
.empty{color:var(--mute);text-align:center;padding:26px 10px}
.disc{font-size:12px;color:var(--mute);text-align:center;margin-top:18px;line-height:1.5}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--mute);font-weight:600}
.bar{height:6px;border-radius:9px;background:#e4eae6;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s}
.story{font-size:16px;margin:0 0 14px}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.val{background:var(--bg);border-radius:12px;padding:8px 10px}.val small{display:block;font-size:11.5px;color:var(--mute);font-weight:600}.val span{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.val.hi span,.val.lo span{color:var(--bad)}.val.hi span::after{content:' ↑';font-size:14px}.val.lo span::after{content:' ↓';font-size:14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;background:#fff;font-weight:500;line-height:1.35}
.opt:hover{border-color:#b8c6c0}.opt.right{border-color:var(--ok);background:var(--ok-l)}.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.fb{margin-top:14px;border-radius:14px;padding:14px;background:var(--acc-l)}
.fb h4{margin:0 0 4px;font-family:'Fraunces',serif;font-size:18px}
.fb p{margin:0;font-size:14.5px}
details{margin-top:12px}summary{cursor:pointer;font-weight:600;color:var(--acc);font-size:14px}
.score{font-family:'Fraunces',serif;font-size:44px;font-weight:600;color:var(--acc);text-align:center;margin:10px 0 0}
/* cheat sheet */
.sheet h2{margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
td:first-child{font-weight:600;white-space:nowrap}
.formula{background:var(--bg);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
.formula b{color:var(--acc)}
ol.steps{padding-left:20px;margin:6px 0}ol.steps li{margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mn{font-size:13.5px}.mn b{color:var(--acc)}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}.causes,.two{grid-template-columns:1fr}h1{font-size:22px}.wrap{padding:12px 12px 50px}}
@media print{html,body{background:#fff!important;}body{font-size:11.5px}nav,header .lang,.noprint,.disc{display:none!important}.wrap{max-width:none;padding:0}.card{border:0;padding:0 0 8px;margin:0;break-inside:avoid}.formula,.cz{background:#f4f6f5}#calc,#quiz{display:none!important}#sheet{display:block!important}h2{font-size:15px}td,th{padding:4px 6px}@page{size:A4;margin:12mm}}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;padding:8px 2px}
.ic{display:inline-flex;align-items:center;justify-content:center}
.lead{color:#46534f;font-size:14.5px;margin:0 0 12px}
.sel{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfcfb;font-weight:600;max-width:100%}
.sel.sm{padding:8px 10px;font-size:14px}
.src{flex:1;min-width:0}.src .sel{width:100%}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.icon{padding:9px;border-radius:11px}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:12px 0 10px}
.zoom{display:flex;gap:6px}
.tg{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#46534f;cursor:pointer}
.tg input{width:18px;height:18px;accent-color:var(--acc)}
.strip{border:1px solid #f0cfc7;border-radius:12px;overflow:hidden;background:#fff8f6}
.scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:30px;position:relative}
.inner{position:relative}
.inner canvas{display:block}
.ov{position:absolute;inset:0 0 -30px 0;pointer-events:none}
.band{position:absolute;top:0;bottom:30px;background:rgba(47,107,99,.12)}
.cl{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--acc);pointer-events:auto;cursor:ew-resize;touch-action:none}
.cl:before{content:'';position:absolute;left:-14px;width:28px;top:0;bottom:0}
.cl i{position:absolute;bottom:2px;left:-13px;width:24px;height:24px;border-radius:50%;background:var(--acc);box-shadow:0 2px 6px rgba(0,0,0,.25);border:3px solid #fff}
.cl.b{border-color:#c0674b}.cl.b i{background:#c0674b}
.clab{position:absolute;top:6px;transform:translateX(-50%);background:#24312e;color:#fff;border-radius:10px;padding:5px 9px;font-size:12px;line-height:1.25;text-align:center;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.clab b{display:block;font-size:14px}.clab span{display:block;color:#bfe0d8}.clab small{color:#a9b6b2}
.ghosts i{position:absolute;top:0;bottom:30px;border-left:2px dashed #2f6b63;opacity:.75}
.rul{position:absolute;left:0;right:0;bottom:0;height:30px;background:rgba(255,255,255,.85);border-top:1px solid #f0cfc7}
.rul i{position:absolute;top:0;height:8px;border-left:1px solid #8c5b52}
.rul i:nth-child(5n+1){height:14px;border-left-width:2px}
.rul em{position:absolute;top:13px;left:2px;font-style:normal;font-size:10.5px;color:#8c5b52;font-weight:600;white-space:nowrap}
.live{margin-top:10px;font-size:14.5px;color:#46534f}.live b{color:var(--acc)}
.hint{font-size:12.5px;color:var(--mute);margin:6px 0 12px}
.takes{display:flex;flex-wrap:wrap;gap:8px}
.cal{margin-top:12px;background:var(--info-l);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cal p{margin:2px 0 0;font-size:13.5px;color:#3c4a46;max-width:420px}
.tbl{display:grid;gap:2px}
.tr{display:grid;grid-template-columns:12px 1fr 1.2fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}
.tr small{display:block;font-size:12px;color:var(--mute)}.tr .v{text-align:right}.tr .v b{font-size:16px;font-variant-numeric:tabular-nums}
.sol p{margin:0 0 10px}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:8px}
.rc{text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rc:hover{border-color:#b8c6c0}
.rc canvas{border-radius:8px;border:1px solid #f3d6cf}
.rc b{font-size:14.5px}.rc p{margin:0;font-size:13px;color:#56635f;line-height:1.4}
.stp{display:flex;gap:6px;align-items:center}.stp input{text-align:center}
.cab{margin:4px 0}
ul.ml{padding-left:18px;margin:6px 0}ul.ml li{margin:6px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#24312e;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media print{.strip,.takes,.tools,.live,.hint,.warn,#main>.card:not(.sheet){display:none!important}nav,header{display:none!important}}
@media (max-width:640px){nav button span{font-size:11px}.tr{grid-template-columns:12px 1fr 1fr}}
[hidden]{display:none!important}

<script>
'use strict';
/* ===== EKG-Signal-Generator (Ableitung II, 500 Hz, mV) ===== */
const FS=500, DUR=10;
const G=(t,mu,s,a)=>a*Math.exp(-((t-mu)*(t-mu))/(2*s*s));
function seeded(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
/* Ein Herzschlag. q = QRS-Beginn (s). o = Optionen */
function beat(y,q,o){
 const N=y.length;const a=Math.max(0,Math.floor((q-0.45)*FS)),b=Math.min(N,Math.ceil((q+0.75)*FS));
 const w=o.qrsW||1,pa=o.pAmp??0.14,tA=o.tAmp??0.3,st=o.st||0,qt=o.qt||0.38;
 for(let i=a;i<b;i++){const t=i/FS;let v=0;
  if(o.p!==false&&o.pq){const pc=q-o.pq+0.05;v+=G(t,pc,0.022,pa)}
  if(o.delta){v+=G(t,q+0.012,0.022,0.32)}
  if(o.lbbb){v+=G(t,q+0.03,0.012,-0.05)+G(t,q+0.055,0.02,0.75)+G(t,q+0.1,0.022,0.85)}

  else{v+=G(t,q+0.012*w,0.006*w,-0.08)+G(t,q+0.04*w,0.011*w,o.rAmp||1.15)+G(t,q+0.068*w,0.009*w,-0.26)}
  const j=q+(o.qrs||0.09);
  if(st){const e=q+qt-0.06;if(t>j-0.01&&t<e){const k=Math.min(1,(t-(j-0.01))/0.02)*Math.min(1,(e-t)/0.12);v+=st*Math.max(0,k)}}

  y[i]+=v}
}
function pace(y,q){const i=Math.round(q*FS);for(let k=0;k<3;k++)if(y[i+k]!==undefined)y[i+k]+=k===1?1.6:-0.25}
function pWave(y,t,amp){const a=Math.floor((t-0.08)*FS),b=Math.ceil((t+0.08)*FS);for(let i=Math.max(0,a);i<Math.min(y.length,b);i++)y[i]+=G(i/FS,t,0.022,amp||0.14)}

const R={

  d:'Jede P-Welle wird übergeleitet, aber PQ-Zeit konstant über 200 ms.'},

  d:'PQ-Zeit wird von Schlag zu Schlag länger, bis eine P-Welle nicht übergeleitet wird. Danach beginnt der Zyklus neu.'},
 mob2:{n:'AV-Block II° Typ Mobitz II (2:1)',c:'av',hr:42,pq:.18,qrs:.11,qt:.42,

 af:{n:'Vorhofflimmern',c:'supra',hr:96,pq:0,qrs:.08,qt:.34,
  d:'Absolute Arrhythmie: RR-Abstände völlig unregelmäßig, keine P-Wellen, flimmernde Grundlinie.'},

  d:'Regelmäßige Schmalkomplex-Tachykardie 150–250/min, P-Wellen meist im QRS versteckt.'},
 ves:{n:'Ventrikuläre Extrasystolen (Bigeminus)',c:'vent',hr:72,pq:.16,qrs:.09,qt:.38,
  d:'Auf jeden Normalschlag folgt eine vorzeitige, breite, schenkelblockartige Extrasystole ohne P-Welle, mit kompensatorischer Pause.'},
 vt:{n:'Ventrikuläre Tachykardie',c:'vent',hr:168,pq:0,qrs:.16,qt:.30,
  d:'Breitkomplex-Tachykardie (QRS über 120 ms), regelmäßig, meist über 120/min. Notfall!'},
 vf:{n:'Kammerflimmern',c:'vent',hr:0,pq:0,qrs:0,qt:0,

 stemi:{n:'ST-Hebung (STEMI-Bild)',c:'isch',hr:88,pq:.16,qrs:.09,qt:.36,

 hyk:{n:'Hyperkaliämie',c:'isch',hr:70,pq:.20,qrs:.11,qt:.38,

 pm:{n:'Schrittmacher-Rhythmus (VVI)',c:'cond',hr:70,pq:0,qrs:.16,qt:.44,

};
const CAT={norm:'Sinusrhythmen',av:'AV-Blockierungen',supra:'Supraventrikulär',vent:'Ventrikulär & Notfall',cond:'Leitung & Schrittmacher',isch:'Ischämie, QT & Elektrolyte'};

function gen(key,seed=7){

 let t=0.55;

 switch(key){
  case 'sinus':case 'brady':case 'tachy':case 'avb1':case 'stemi':case 'lqt':case 'hyk':case 'lbbb':case 'wpw':{
   const ex={stemi:{st:.3},lqt:{tW:.06},hyk:{tAmp:.85,tPeak:true,pAmp:.06,qrsW:1.15},lbbb:{lbbb:true,tAmp:-.32},wpw:{delta:true,qrsW:1.2}}[key]||{};
   while(t<DUR){const j=(r()-.5)*0.03;beat(y,t,{...std(),...ex});t+=rr+j}break}

  case 'mob2':{const pp=rr/2;let k=0;while(t<DUR){beat(y,t,{...std(),qrsW:1.2});pWave(y,t-o.pq+.05+pp);t+=rr;k++}break}
  case 'avb3':{let tp=0.2;while(tp<DUR){pWave(y,tp);tp+=0.75}while(t<DUR){beat(y,t,{p:false,qrs:.14,qt:.46,qrsW:1.6,tAmp:-.2});t+=rr}break}
  case 'af':{while(t<DUR){beat(y,t,{p:false,qrs:.08,qt:.34});t+=0.42+r()*0.55}for(let i=0;i<y.length;i++){const s=i/FS;y[i]+=0.045*Math.sin(2*Math.PI*6.3*s+1)+0.03*Math.sin(2*Math.PI*8.1*s+2)+0.02*Math.sin(2*Math.PI*4.7*s)}break}
  case 'flut':{for(let i=0;i<y.length;i++){const s=i/FS,ph=(s*5)%1;y[i]+=ph<.75?-0.22*(ph/.75)+0.11:-0.11+0.22*((ph-.75)/.25)-0.0}while(t<DUR){beat(y,t,{p:false,qrs:.08,qt:.38});t+=0.8}break}

  case 'ves':{let k=0;while(t<DUR){if(k%2===0){beat(y,t,std());t+=0.52}else{beat(y,t,{p:false,vent:true,qrs:.15,qt:.44,tAmp:-.45,tW:.07});t+=1.08}k++}break}
  case 'vt':{while(t<DUR){beat(y,t,{p:false,vent:true,qrsW:1.15,qt:.3,tAmp:-.5,tW:.06});t+=rr}break}
  case 'pm':{while(t<DUR){pace(y,t-0.01);beat(y,t,{p:false,vent:true,qt:.44,tAmp:-.35,tW:.07});t+=rr}break}
  case 'vf':{let a=.5;for(let i=0;i<y.length;i++){const s=i/FS;if(i%250===0)a=.25+r()*.55;y[i]+=a*(Math.sin(2*Math.PI*4.6*s+Math.sin(s*1.3)*2)+0.5*Math.sin(2*Math.PI*6.9*s+1))}break}

 noise(y,r,key==='asys'?0.012:0.018);

 c.strokeStyle='#eba697';c.lineWidth=1.1;c.beginPath();for(let x=0;x<=W;x+=mm*5){c.moveTo(Math.round(x)+.5,0);c.lineTo(Math.round(x)+.5,H)}for(let v=0;v<=H;v+=mm*5){c.moveTo(0,Math.round(v)+.5);c.lineTo(W,Math.round(v)+.5)}c.stroke();

}
function thumb(cv,key,w,h){const {y}=gen(key,3);const dpr=Math.min(2,devicePixelRatio||1);cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';

 c.strokeStyle='#1d2422';c.lineWidth=1.3;c.beginPath();const y0=h*.64,sc=mm*10*0.8;for(let i=Math.floor(1.2*FS);i<5.2*FS;i++){const x=(i/FS-1.2)*25*mm;i===Math.floor(1.2*FS)?c.moveTo(x,y0-y[i]*sc):c.lineTo(x,y0-y[i]*sc)}c.stroke()}

const ICON={

/* ================= Streifen mit digitalem Zirkel ================= */
function Strip(opts){
 const st={mm:(opts.mm||5)*(innerWidth<640?0.68:1),src:opts.src||'gen',key:opts.key||'sinus',seed:opts.seed||7,img:null,imgW:0,pxmm:null,speed:25,xa:0,xb:0,march:false,ruler:true,zoom:1};
 const cv=h('canvas'),ov=h('div',{class:'ov'}),inner=h('div',{class:'inner'},cv,ov),scroll=h('div',{class:'scroll'},inner);
 const lab=h('div',{class:'clab'}),la=h('div',{class:'cl a'},h('i')),lb=h('div',{class:'cl b'},h('i')),band=h('div',{class:'band'}),ghosts=h('div',{class:'ghosts'}),rul=h('div',{class:'rul'});
 ov.append(band,ghosts,rul,la,lb,lab);
 const el=h('div',{class:'strip'},scroll);
 let W=0,H=0,ox=0;
 const msPerPx=()=>st.src==='gen'?1000/(25*st.mm):(st.pxmm?1000/(st.speed*st.pxmm*st.zoom):null);
 const mmPerPx=()=>st.src==='gen'?1/st.mm:(st.pxmm?1/(st.pxmm*st.zoom):null);
