*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f1ede7;color:#2e2a27;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.gwrap,.scr{background:var(--bg);color:var(--ink);min-height:100%;position:relative;overflow-x:hidden}.gwrap{min-height:100vh}
.gv{max-width:480px;margin:0 auto;position:relative;min-height:100%;text-align:center}
.mus{position:absolute;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.12);cursor:pointer}.mus.on{background:var(--acc);color:#fff}
.phone .gv .mus{top:40px}
.envS{position:relative;height:100vh;min-height:620px;max-height:900px;overflow:hidden;cursor:pointer;background:var(--bg)}.scr .envS{height:716px;min-height:0}.envS.gone{display:none}
.envS .eh{position:absolute;top:22%;left:0;right:0;font:500 48px 'Caveat';color:var(--acc)}
.env{position:absolute;left:10%;right:10%;top:40%;aspect-ratio:1.5;perspective:900px}
.env .back{position:absolute;inset:0;background:#e9dcc7;border-radius:6px;box-shadow:0 16px 30px rgba(80,60,30,.18)}
.env .letter{position:absolute;left:6%;right:6%;top:8%;height:86%;background:#fff;border-radius:3px;transition:transform 1s .5s cubic-bezier(.3,.6,.3,1)}
.th-retro .env .letter{background:repeating-linear-gradient(90deg,#f7c9d4 0 18px,#fbeaa6 18px 36px)}
.env .front{position:absolute;inset:0;background:#efe4d2;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:6px}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;background:#f4ebdc;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s}
.env .seal{position:absolute;left:50%;top:62%;width:84px;height:84px;margin:-42px 0 0 -42px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efd796,#b8913f 60%,#8f6c2c);box-shadow:0 4px 10px rgba(0,0,0,.3);font:40px 'Great Vibes';color:#6e5220;cursor:pointer;animation:sb 2.4s ease-in-out infinite}
.env .seal:after{content:'';position:absolute;inset:11px;border-radius:50%;border:1.5px solid rgba(110,82,32,.45)}@keyframes sb{50%{transform:scale(1.06)}}
.open .seal{opacity:0;animation:none;transition:opacity .4s}.open .flap{transform:rotateX(180deg)}.open .letter{transform:translateY(-60%)}
.envS .tap{position:absolute;top:82%;left:0;right:0;font-size:15px;color:var(--sub)}
.inv{display:none}.inv.show{display:block;animation:fi 1s}@keyframes fi{from{opacity:0;transform:translateY(14px)}}
.cover{position:relative;min-height:100vh;max-height:860px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 26px}.scr .cover{min-height:716px}
.cv-retro{background:#fbeaa6}.stripes{position:absolute;inset:0}.stripes svg{width:100%;height:100%}
.cv-retro .cin{position:relative;color:#e0457b}.cv-retro .k{font:600 13px 'DM Sans';letter-spacing:.24em}.cv-retro .big{font:400 66px/0.95 'Playfair Display',serif;margin:16px 0;word-break:break-word;hyphens:auto}.cv-retro .sub{font:500 16px/1.45 'DM Sans';white-space:pre-line}
.cv-aqua{justify-content:flex-start;padding-top:80px}.cv-aqua .nm{font:500 14px 'DM Sans';letter-spacing:.24em;color:#9a9284}.cv-aqua .sc1{font:62px/1.1 'Great Vibes';color:#5f7f86;margin-top:4px}.cv-aqua img{width:86%;max-width:330px;margin-top:10px}.cv-aqua .tx{font:italic 500 19px/1.45 'Cormorant Garamond';color:#6b6558;margin-top:10px;white-space:pre-line}
.cv-fun{justify-content:flex-start;padding-top:80px}.cv-fun .k{font:600 12px 'DM Sans';letter-spacing:.26em;color:#9a9284}.cv-fun .big{font:400 46px/1.02 'Playfair Display',serif;margin-top:10px;white-space:pre-line}.cv-fun img{max-height:330px;max-width:85%;margin-top:20px}.cv-fun .fs{font:500 14px 'DM Sans';letter-spacing:.2em;color:#9a9284;margin-top:14px;white-space:pre-line}
.ibody{padding:30px 14px 40px;background:#efe9e0}
.th{font:500 40px 'Caveat';color:#3a3631}.tsub{font:500 14px 'DM Sans';color:#8a8276;margin-bottom:16px}
.notes{columns:2;column-gap:12px;text-align:left}
.n{break-inside:avoid;margin-bottom:12px;padding:13px 13px 11px;border-radius:4px;color:#3a3631;box-shadow:0 3px 8px rgba(0,0,0,.08);transform:rotate(var(--r))}
.n .nt{font:500 21px/1.18 'Caveat';white-space:pre-line;word-break:break-word}.n b{display:block;font:600 11px 'DM Sans';letter-spacing:.1em;color:#8a8276;margin-top:7px}
.n.y{background:#fdf3c4}.n.p{background:#fbe0e6}.n.g{background:#e3ecdf}.n.w{background:#fff}
.n img{width:100%;border-radius:3px;margin-bottom:7px;aspect-ratio:1.3;object-fit:cover}
.gift{padding:26px 0 6px}.gh{font:500 38px 'Caveat';color:#3a3631}
.coin{position:relative;width:240px;height:240px;border-radius:50%;margin:16px auto 0;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;padding:30px;box-shadow:0 10px 24px rgba(0,0,0,.15)}
.gtx{font:500 26px/1.15 'Caveat';color:#3a3631}.foil{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.bye{font:500 40px 'Caveat';color:var(--acc);margin-top:26px}
.btn{display:inline-block;border:0;border-radius:30px;padding:12px 20px;font:600 15px 'DM Sans';background:var(--acc);color:#fff;margin-top:16px;cursor:pointer}.btn.o{background:#fff;color:#3a3631;border:2px solid #3a3631}
.priv{font-size:11px;color:#8a8276;margin-top:18px;opacity:.75}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:50;border-radius:2px;animation:cfa linear forwards}@keyframes cfa{to{transform:translateY(105vh) rotate(540deg)}}
/* Kollegen-Formular + Herumreichen: groß und einfach */
.coll,.pin{max-width:520px;margin:0 auto;padding:44px 22px 40px;text-align:left;color:#2f2d2a;background:#fff;min-height:100vh}
.ch{font:700 30px/1.15 'DM Sans'}.cs{font:500 18px 'DM Sans';color:#6b665c;margin:8px 0 6px}.sec{font:500 15px 'DM Sans';color:#b5703c;margin-bottom:8px}
.coll label,.pin label{display:block;font:700 18px 'DM Sans';margin:18px 0 8px}
.coll input,.coll textarea,.pin input,.pin textarea{width:100%;border:2px solid #d9d4ca;border-radius:16px;padding:15px;font:500 20px/1.35 'DM Sans';background:#fff}
.coll textarea,.pin textarea{resize:vertical}.err{border-color:#d0463c!important}
.chip2{border:0;background:#f1ede6;border-radius:22px;padding:11px 15px;font:700 15px 'DM Sans';margin:12px 8px 0 0;cursor:pointer}
.pv img{width:120px;border-radius:12px;margin-top:10px}
.big-btn{display:block;width:100%;margin-top:24px;border:0;background:#2f7a5f;color:#fff;border-radius:18px;padding:21px;font:700 22px 'DM Sans';cursor:pointer}
.mail{display:block;text-align:center;margin-top:14px;font:600 16px 'DM Sans';color:#2f7a5f}
.done{font:600 17px/1.4 'DM Sans';color:#2f7a5f;margin-top:16px}
.pass{position:fixed;inset:0;z-index:100;background:#fff;overflow:auto}.flash{background:#e3f1ea;color:#2f7a5f;font:700 18px 'DM Sans';padding:14px;border-radius:14px;margin-bottom:16px}
.pin .b2{display:block;width:100%;margin-top:12px;text-align:center}
/* Editor */
.gbox .way{background:#fff;border:1px solid #e8e2da;border-radius:16px;padding:14px;margin:10px 0}.gbox .way b{font-size:15px}.gbox .way p{font-size:13.5px;color:#6b665c;margin:4px 0 8px}
.gbox textarea{width:100%;border:1px solid #ddd5cb;border-radius:10px;padding:8px}
.mlist{margin-top:12px}.mi{background:#fff;border:1px solid #e8e2da;border-radius:12px;padding:8px;margin-top:8px}.mi input{flex:1;border:1px solid #ddd5cb;border-radius:8px;padding:6px 8px;font-weight:600}.mi textarea{margin-top:6px;font-family:'Caveat';font-size:18px}.mi img{width:40px;height:40px;object-fit:cover;border-radius:6px}
.x{border:0;background:#f4f2ec;width:30px;height:30px;border-radius:50%;cursor:pointer}
.lk .sw{height:80px;border-radius:10px;margin-bottom:6px}.sw-retro{background:repeating-linear-gradient(90deg,#f7c9d4 0 12px,#fbeaa6 12px 24px)}.lk.sm{width:110px}
@media print{body *{visibility:hidden}.gv,.gv *{visibility:visible}.gv{position:absolute;left:0;top:0;max-width:none;width:100%}.envS,.mus,.prt,.priv,.gift{display:none!important}.cover{min-height:0;height:auto;page-break-after:always;padding:60px}.notes{columns:3}.ibody{background:#fff}.n{box-shadow:none;border:1px solid #eee}}
/* host */
.host{min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid #e8e2da;position:sticky;top:0;z-index:5}
.brand{font-family:'Great Vibes';font-size:28px;color:#8a6a5c}
.nav{display:flex;gap:6px}.nav button{border:0;background:none;padding:9px 16px;border-radius:20px;cursor:pointer;font-weight:600;color:#7a7068}.nav button.on{background:#2e2a27;color:#fff}
.cols{display:flex;gap:30px;max-width:1180px;margin:0 auto;padding:24px}
.main{flex:1;min-width:0;max-width:640px}
.main h1{font-family:'Cormorant Garamond';font-weight:600;font-size:32px;margin-bottom:8px}
.main h3{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#8a7f73;margin:22px 0 10px}
.f{margin-bottom:12px}.f label{display:block;font-size:13px;color:#6f655d;margin-bottom:5px}
.f input,.f select,textarea,.qi input,.row input{width:100%;border:1px solid #ddd5cb;border-radius:12px;padding:11px 13px;background:#fff;font-size:15px}
textarea{resize:vertical;line-height:1.5}
.looks{display:flex;gap:10px;flex-wrap:wrap}.lk{border:1.5px solid #ddd5cb;background:#fff;border-radius:16px;padding:10px;width:150px;cursor:pointer;text-align:center}.lk.on{border-color:#2e2a27;box-shadow:0 0 0 2px #2e2a27}
.lk img{height:70px;max-width:100%;object-fit:contain;display:block;margin:0 auto 6px}.lk span{font-size:12.5px}
.gl{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:center;gap:7px;border:1px solid #ddd5cb;background:#fff;border-radius:20px;padding:8px 13px;cursor:pointer;font-size:14px}
.sec{background:#fff;border:1px solid #e8e2da;border-radius:16px;padding:14px 16px;margin-top:12px}.sec summary{cursor:pointer;font-weight:600}.sec[open] summary{margin-bottom:12px}
.qi{border-bottom:1px solid #eee7df;padding:12px 0}.qh{display:flex;gap:8px;align-items:center}.qh b{color:#8a7f73;width:24px}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;

 start(name){if(this.on)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!this.ctx){this.ctx=new AC();this.out=this.ctx.createGain();this.out.gain.value=.5;const dl=this.ctx.createDelay();dl.delayTime.value=.23;const fb=this.ctx.createGain();fb.gain.value=.22;this.out.connect(this.ctx.destination);this.out.connect(dl);dl.connect(fb).connect(dl);dl.connect(this.ctx.destination)}this.ctx.resume();this.on=true;const S=this.songs[name]||this.songs.kanon;const beat=60/S.bpm;let next=this.ctx.currentTime+.1;
