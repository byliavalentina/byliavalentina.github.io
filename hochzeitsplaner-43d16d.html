*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f7f5f0;color:#3f4535;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
/* planner */
.pl-app{display:flex;min-height:100vh}
.side{width:220px;flex:none;background:#fff;border-right:1px solid #ebe7de;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font:500 24px 'Cormorant Garamond';margin:0 0 2px 8px}.side .sub{font:600 10.5px 'DM Sans';letter-spacing:.2em;color:#9a9f8c;margin:0 0 18px 8px;text-transform:uppercase}
.sb{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;font-size:14px;color:#5d6152;cursor:pointer;margin-bottom:2px}.sb.on{background:#eef0e8;color:#2f3527;font-weight:600}.sb:hover{background:#f4f5ef}
.bk{margin-top:22px;border-top:1px solid #ebe7de;padding-top:14px}.bk .small{margin-bottom:8px}
.pm{flex:1;min-width:0;padding:26px 30px 60px;max-width:1200px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:12px;flex-wrap:wrap}.ph h1{font:500 36px 'Cormorant Garamond'}.cdx{font:600 11px 'DM Sans';letter-spacing:.18em;color:#8b917f;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile,.card{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 1px 6px rgba(0,0,0,.04);margin-bottom:14px}.grid .tile{margin:0}
.ct{font:600 11px 'DM Sans';letter-spacing:.2em;color:#8b917f;margin-bottom:8px}
.num{font:500 34px 'Cormorant Garamond'}.small{font-size:12.5px;color:#8b917f;line-height:1.45}.warn{color:#b3261e}
.pb{height:7px;border-radius:7px;background:#eceee6;margin:8px 0;overflow:hidden}.pb i{display:block;height:100%;background:#7f8b67}
.li{font-size:14px;color:#4d5242;margin-top:7px;display:flex;gap:8px;align-items:center}.li b{font-weight:600;min-width:52px}
.li input[type=checkbox],td input[type=checkbox]{width:18px;height:18px;accent-color:#5d6747;flex:none}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.mgrid div{aspect-ratio:1;border-radius:6px;background-size:cover;background-position:center}
.card h3{font:500 22px 'Cormorant Garamond';margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.flat{flex:1;border:0;border-bottom:1px solid transparent;padding:4px 2px;background:none;font-size:14px}.flat:focus{outline:0;border-color:#c9cdb4}
.x{border:0;background:#f4f2ec;width:28px;height:28px;border-radius:50%;cursor:pointer;color:#8b917f;font-size:16px;flex:none}
.b1,.b2{display:inline-block;border:0;border-radius:24px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;font-size:13.5px;margin:10px 8px 0 0}.b1{background:#5d6747;color:#fff}.b2{background:#fff;border:1.5px solid #5d6747;color:#5d6747}.s{padding:7px 13px;font-size:12.5px}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb th{text-align:left;font:600 10.5px 'DM Sans';letter-spacing:.16em;color:#8b917f;text-transform:uppercase;padding:6px 6px;border-bottom:1px solid #ebe7de}
.tb td{padding:4px 6px;border-bottom:1px solid #f1eee7}.tb td input:not([type=checkbox]),.tb td select{width:100%;border:1px solid transparent;border-radius:8px;padding:6px 7px;background:none}.tb td input:hover,.tb td select:hover{border-color:#e3ded3}
.tb .nar{width:80px}.tb tr.sum td{font-weight:600;padding:10px 6px}
.card>.row input[type=number],.card .row>input{border:1px solid #e3ded3;border-radius:10px;padding:8px 10px;width:110px}
textarea{width:100%;border:1px solid #e3ded3;border-radius:10px;padding:9px 11px;resize:vertical;background:#fff}
.chipsrow{display:flex;gap:8px;margin-bottom:14px}.pill{background:#fff;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.05)}.pill.y{color:#4f6b3a}.pill.n{color:#a2554a}
select.st-y{color:#4f6b3a;font-weight:600}select.st-n{color:#a2554a}
.pool{min-height:90px}.gch{display:inline-block;background:#eef0e8;border-radius:16px;padding:6px 11px;margin:4px 4px 0 0;font-size:13px;cursor:grab}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.tbl{background:#fff;border:2px dashed #d7dbc9;border-radius:50%;aspect-ratio:1;padding:22px 12px;text-align:center;overflow:hidden}.tbl.full{border-color:#c98a7e}.tbl.ov,.pool.ov{background:#f4f6ee}
.tn{font:500 28px 'Cormorant Garamond'}.tc{font-size:11px;color:#8b917f;margin-bottom:4px}.tbl .gch{font-size:12px;padding:4px 8px}
.mood{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}.mi{aspect-ratio:1;border-radius:12px;background-size:cover;background-position:center;position:relative}.mi .x{position:absolute;top:6px;right:6px}
input[type=color]{width:54px;height:40px;border:0;background:none;cursor:pointer}
.sitecols{display:flex;gap:28px;align-items:flex-start}.sed{flex:1;min-width:0;max-width:600px}.pcol{flex:none}
.sed h3{font:600 11px 'DM Sans';letter-spacing:.2em;color:#8b917f;text-transform:uppercase;margin:20px 0 8px}
.f{margin-bottom:11px}.f label{display:block;font-size:12.5px;color:#6b6f60;margin-bottom:4px}.f input,.f select,.sed>input{width:100%;border:1px solid #e3ded3;border-radius:10px;padding:10px 12px;background:#fff;font-size:14.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gl{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.chip{display:flex;align-items:center;gap:7px;border:1px solid #e3ded3;background:#fff;border-radius:20px;padding:7px 12px;font-size:13px;cursor:pointer}
.looks{display:flex;gap:10px;flex-wrap:wrap}.lk{border:1.5px solid #e3ded3;background:#fff;border-radius:14px;padding:8px;width:160px;cursor:pointer;font-size:12.5px}.lk.on{border-color:#3f4535;box-shadow:0 0 0 2px #3f4535}.lk .sw{height:64px;border-radius:9px;margin-bottom:6px;display:flex;align-items:center;justify-content:center}.lk .sw i{width:34px;height:34px;border-radius:50%;display:block}
.qr{display:block;max-width:240px;width:100%;border:1px solid #e3ded3;border-radius:12px;background:#fff;margin-top:6px}
.phone{position:sticky;top:20px;width:360px;height:740px;border-radius:48px;background:#1d1b1a;padding:12px;box-shadow:0 20px 40px rgba(60,40,20,.15)}
.phone .scr{height:100%;border-radius:37px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:var(--bg)}
@media(max-width:900px){.pl-app{flex-direction:column}.side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px;padding:12px}.side .brand,.side .sub{width:100%}.sb{width:auto;padding:7px 10px;font-size:13px}.bk{width:100%}.pm{padding:18px 14px}.grid{grid-template-columns:1fr}.sitecols{flex-direction:column}.phone{position:static;width:min(360px,100%);margin:0 auto}.tb{font-size:13px}.tb .nar{width:56px}}
/* guest site */
.gwrap,.scr{background:var(--bg);color:var(--ink);position:relative;overflow-x:hidden}.gwrap{min-height:100vh}
.gv{max-width:520px;margin:0 auto;position:relative;text-align:center}
.mus{position:absolute;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.12);cursor:pointer}.mus.on{background:var(--acc);color:#fff}
.phone .mus{top:36px}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

        alt = opts.alt;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
