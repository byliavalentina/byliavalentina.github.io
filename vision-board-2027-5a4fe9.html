:root{
  --bg:#ece6db; --panel:#fbf8f2; --line:#e2dacb; --ink:#3b3a36; --mute:#8a8478;
  --sage:#7d8f6e; --sage-l:#e3e9da; --terra:#c47c5a; --rose:#d9a89c; --gold:#c9a24a;
  --r:14px; --hs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{position:fixed;inset:0;display:grid;grid-template-rows:56px 1fr;grid-template-columns:64px 1fr auto}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{font-family:'Fraunces',serif;font-style:italic;font-size:21px;white-space:nowrap;margin-right:6px}
.brand b{font-style:normal;font-weight:600;color:var(--terra)}
.boardsel{display:flex;align-items:center;gap:4px;min-width:0}
.boardsel select{max-width:170px;font:inherit;padding:7px 28px 7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.ib:hover{background:#f1ece2}
.ib.on{background:var(--sage-l);color:#4f5f43}
.ib svg{width:20px;height:20px}
.ib:disabled{opacity:.35;cursor:default}
.pill{padding:8px 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;white-space:nowrap;display:flex;gap:6px;align-items:center}
.pill svg{width:16px;height:16px}
.lang{font-weight:600;font-size:12px;letter-spacing:.05em;border:1px solid var(--line);border-radius:10px;padding:8px 9px}
/* left rail */
.rail{grid-row:2;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;overflow-y:auto}
.rail .ib{width:44px;height:44px}
.rail hr{width:32px;border:0;border-top:1px solid var(--line);margin:6px 0}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);margin:3px;flex:none}
.dot.on{box-shadow:0 0 0 2px var(--ink)}
.sz{width:44px;height:30px;display:grid;place-items:center;border-radius:8px}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz.on{background:var(--sage-l)}
/* stage */
.stage{grid-row:2;position:relative;overflow:hidden;display:grid;place-items:center;touch-action:none}
.board{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:6px;box-shadow:0 1px 2px rgba(60,50,30,.08),0 12px 40px rgba(60,50,30,.13);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.els{position:absolute;inset:0;z-index:0}
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.szs{display:contents}
.board.drawing .ink{pointer-events:auto;cursor:crosshair}
.el{position:absolute;touch-action:none}
.el .mo{position:absolute;inset:0;will-change:transform}
.el img.stk{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.board.drawing .el{pointer-events:none}
.lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;line-height:1;outline:none}
.note{position:absolute;inset:0;border-radius:4px;padding:20px 22px;box-shadow:0 1px 1px rgba(0,0,0,.05),0 8px 18px rgba(70,55,30,.12);overflow:hidden}
.nh{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8a8478;margin-bottom:8px;line-height:1.3;outline:none}
.nb{font-family:'Caveat',cursive;font-size:32px;line-height:1.12;outline:none;min-height:1.2em;white-space:pre-wrap;word-wrap:break-word}
[data-f]:empty::before{content:attr(data-ph);color:#b9b1a2}
.goal{position:absolute;inset:0;background:#fffdf8;border-radius:6px;padding:20px 22px;box-shadow:0 1px 1px rgba(0,0,0,.05),0 8px 18px rgba(70,55,30,.12);overflow:hidden}
.gt{font-family:'Fraunces',serif;font-style:italic;font-size:28px;line-height:1.15;margin-bottom:10px;outline:none}
.goal ul{list-style:none;margin:0;padding:0}
.goal li{display:flex;align-items:flex-start;gap:12px;font-family:'Caveat',cursive;font-size:28px;line-height:1.15;padding:5px 0}
.cb{flex:none;width:24px;height:24px;border:2.5px solid var(--ink);border-radius:6px;margin-top:4px;position:relative;cursor:pointer}
.cb.done{background:var(--sage)}
.cb.done::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
li.done .st{text-decoration:line-through;text-decoration-color:var(--terra);color:#8a8478}
.st{outline:none;flex:1;min-width:20px}
.addstep{font-size:15px;color:var(--mute);padding:6px 0;font-weight:600}
.stamp{position:absolute;right:16px;bottom:14px;font-family:'Caveat',cursive;font-weight:700;font-size:34px;color:var(--terra);transform:rotate(-8deg);border:3px solid var(--terra);border-radius:10px;padding:0 10px;opacity:0;transition:opacity .3s}
.goal.done .stamp{opacity:.9}
.zone{position:absolute;inset:0;border:3px dashed #b9c2ae;border-radius:22px}
.zl{position:absolute;left:22px;top:12px;font-family:'Caveat',cursive;font-weight:700;font-size:34px;color:#7d8f6e;outline:none;white-space:nowrap}
.media{position:absolute;inset:0;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 22px rgba(70,55,30,.16)}
.media.plain{background:none;box-shadow:0 8px 20px rgba(70,55,30,.14);border-radius:10px;overflow:hidden}
.media .pic{position:absolute;overflow:hidden;background:#eee7dc}
.media .pic>*{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cap{position:absolute;left:0;right:0;text-align:center;font-family:'Caveat',cursive;font-size:30px;line-height:1;outline:none;white-space:nowrap;overflow:hidden}
/* selection */
.sel{position:absolute;z-index:2!important;pointer-events:none;border:calc(2px*var(--hs)) solid var(--terra);border-radius:4px}
.sel .h{position:absolute;pointer-events:auto;width:calc(30px*var(--hs));height:calc(30px*var(--hs));border-radius:50%;background:#fff;border:calc(2px*var(--hs)) solid var(--terra);touch-action:none}
.sel .rs{right:calc(-15px*var(--hs));bottom:calc(-15px*var(--hs));cursor:nwse-resize}
.sel .rt{left:50%;top:calc(-52px*var(--hs));margin-left:calc(-15px*var(--hs));cursor:grab}
.sel .rt::after{content:"";position:absolute;left:50%;top:100%;height:calc(22px*var(--hs));border-left:calc(2px*var(--hs)) solid var(--terra)}
/* selection bar */
.sbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(60,50,30,.14);display:none;align-items:center;gap:2px;padding:5px;z-index:20;max-width:calc(100% - 20px);overflow-x:auto}
.sbar.show{display:flex}
.sbar select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:#fff}
.sbar .ib{width:36px;height:36px}
.sbar .sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12);margin:0 2px;flex:none}
.sbar .vs{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{aspect-ratio:1;border-radius:12px;background:#f4efe6;display:grid;place-items:center;padding:10px;transition:background .15s}
.tile:hover{background:#ece5d8}
.tile img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.tile.wide{grid-column:span 2;aspect-ratio:2.6}
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{font-family:'Caveat',cursive;font-size:24px;font-weight:700;padding:2px 12px;border-radius:10px;background:#f4efe6}
.word:hover{background:#ece5d8}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scn{border-radius:10px;overflow:hidden;background:#fff;padding:5px 5px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.scn canvas{width:100%;aspect-ratio:1;display:block;border-radius:3px}

.big{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:12px;background:#f4efe6;text-align:left;margin-bottom:8px;font-weight:600}
.big:hover{background:#ece5d8}
.big small{display:block;font-weight:400;color:var(--mute);font-size:12.5px;margin-top:2px}
.big .ic{width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.big .ic svg{width:22px;height:22px}
.hint{font-size:12.5px;color:var(--mute);line-height:1.5;margin:6px 2px}
.area{border-radius:12px;background:#f4efe6;margin-bottom:8px;overflow:hidden}
.area>button{width:100%;text-align:left;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between}
.area .ps{display:none;padding:0 8px 8px}
.area.open .ps{display:block}
.pr{display:block;width:100%;text-align:left;background:#fff;border-radius:9px;padding:10px 12px;margin-top:6px;font-family:'Caveat',cursive;font-size:22px;line-height:1.1}
.pr:hover{background:#fdfaf4}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bgt{aspect-ratio:1.4;border-radius:10px;border:2px solid transparent;background-size:120px}
.bgt.on{border-color:var(--ink)}

.menu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(60,50,30,.18);padding:6px;z-index:50;min-width:240px;display:none}
.menu.show{display:block}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:9px}
.menu button:hover{background:#f1ece2}
.menu button svg{width:18px;height:18px;flex:none}
.menu small{display:block;color:var(--mute);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.modal{position:fixed;inset:0;background:rgba(50,45,35,.35);display:none;place-items:center;z-index:100;padding:16px}
.modal.show{display:grid}
.card{background:var(--panel);border-radius:20px;max-width:560px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(40,30,10,.25);max-height:92vh;overflow-y:auto}

.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;font-weight:600;background:#fff}

.opt.on{border-color:var(--ink)}
.opt .pv{margin:0 auto 8px;border:1.5px solid var(--ink);border-radius:3px;background:#f7f2e8}

.cta{width:100%;padding:14px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:15px}
.ghost{padding:12px 16px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.card input[type=text]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0 14px}
.help li{margin:0 0 9px;line-height:1.5;color:#55514a}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:200;pointer-events:none;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%)}
.conf{position:absolute;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:30}
.prog{height:8px;border-radius:9px;background:#eee7da;overflow:hidden;margin:14px 0}

@keyframes a-float{50%{transform:translateY(-6%)}}
@keyframes a-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes a-pulse{50%{transform:scale(1.07)}}
@keyframes a-spin{to{transform:rotate(360deg)}}
@keyframes a-twinkle{50%{transform:scale(1.12);opacity:.7}}
@keyframes a-flutter{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.45)}}
@keyframes a-drift{50%{transform:translateX(9%)}}

.motion .tile img.m-float{animation:a-float 3s ease-in-out infinite}
.motion .tile img.m-sway{animation:a-sway 3s ease-in-out infinite;transform-origin:50% 100%}
.motion .tile img.m-pulse{animation:a-pulse 2.4s ease-in-out infinite}
.motion .tile img.m-spin{animation:a-spin 16s linear infinite}
.motion .tile img.m-twinkle{animation:a-twinkle 2s ease-in-out infinite}
.motion .tile img.m-flutter{animation:a-flutter .9s ease-in-out infinite}
.motion .tile img.m-drift{animation:a-drift 6s ease-in-out infinite}
.motion .tile img.m-coin{animation:a-coin 2.6s ease-in-out infinite}
.motion .tile img.m-beat{animation:a-beat 1.6s ease-in-out infinite}

 if(key==='linen'){c.strokeStyle='rgba(120,100,70,.06)';c.lineWidth=1;for(let i=0;i<s;i+=3){c.beginPath();c.moveTo(i+.5,0);c.lineTo(i+.5,s);c.stroke();c.beginPath();c.moveTo(0,i+.5);c.lineTo(s,i+.5);c.stroke()}}

/* ===================== storage ===================== */
const DBN='lv-visionboard-2027';let db=null,memMedia={},storageOK=true;
function idb(){return new Promise(res=>{try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('media')};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function tx(store,mode,fn){return new Promise(res=>{if(!db)return res(null);try{const x=db.transaction(store,mode),s=x.objectStore(store);const r=fn(s);x.oncomplete=()=>res(r&&r.result);x.onerror=()=>res(null)}catch(e){res(null)}})}
const kvGet=k=>db?tx('kv','readonly',s=>s.get(k)):Promise.resolve((()=>{try{return JSON.parse(localStorage.getItem(DBN+k))}catch(e){return null}})());
const kvSet=(k,v)=>db?tx('kv','readwrite',s=>s.put(v,k)):Promise.resolve((()=>{try{localStorage.setItem(DBN+k,JSON.stringify(v))}catch(e){}})());
const mediaPut=(id,blob)=>{memMedia[id]=blob;return db?tx('media','readwrite',s=>s.put(blob,id)):Promise.resolve()};
async function mediaGet(id){if(memMedia[id])return memMedia[id];const b=db?await tx('media','readonly',s=>s.get(id)):null;if(b)memMedia[id]=b;return b}
const urlCache={};
async function mediaURL(id){if(urlCache[id])return urlCache[id];const b=await mediaGet(id);if(!b)return null;return urlCache[id]=URL.createObjectURL(b)}

async function exportBackup(){const media={};const ids=new Set();S.boards.forEach(b=>b.elements.forEach(e=>{if(e.media)ids.add(e.media)}));for(const id of ids){const b=await mediaGet(id);if(b)media[id]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
 download(new Blob([JSON.stringify({app:'lv-visionboard-2027',state:S,media})],{type:'application/json'}),'vision-board-2027-sicherung.json');toast(t('saved'))}
$('#backupIn').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='lv-visionboard-2027')throw 0;for(const id in d.media){const b=await (await fetch(d.media[id])).blob();await mediaPut(id,b)}S=d.state;setLang(S.lang||'de');switchBoard(S.current||S.boards[0].id);toast(t('saved'))}catch(e){toast('?')}});

/* ===================== global UI ===================== */
function setLang(l){lang=S.lang=l;document.documentElement.lang=l;$('#langBtn').textContent=l==='de'?'EN':'DE';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 [['#undoBtn','undo'],['#redoBtn','redo'],['#helpBtn','help'],['#drawerBtn','add'],['#boardMenuBtn','boardMenu']].forEach(([s,k])=>$(s).title=t(k));updMotionBtn();renderRail();renderTabs();if(B){renderPane();renderSbar();B.elements.forEach(e=>{if(e.type==='note'||e.type==='goal')renderEl(e)})}persist()}
function updMotionBtn(){const b=$('#motionBtn');b.innerHTML=icon(S.motion?'pause':'play');b.title=S.motion?t('motionOff'):t('motionOn');b.classList.toggle('on',!S.motion)}
$('#langBtn').onclick=()=>setLang(lang==='de'?'en':'de');
$('#motionBtn').onclick=()=>{S.motion=!S.motion;updMotionBtn();renderPane();persist()};
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;$('#helpBtn').onclick=help;$('#drawerBtn').onclick=()=>toggleDrawer();
document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));$('#boardMenuBtn').innerHTML=icon('dots',2.4);
document.addEventListener('gesturestart',e=>e.preventDefault());

(async function init(){db=await idb();if(!db)storageOK=false;
 try{await Promise.all(['700 40px Caveat','400 40px Caveat','italic 400 40px Fraunces','600 20px DM Sans','400 20px DM Sans'].map(f=>document.fonts.load(f)))}catch(e){}
 const saved=await kvGet('state');if(saved&&saved.boards&&saved.boards.length){S=saved;if(matchMedia('(prefers-reduced-motion: reduce)').matches&&S.motion==null)S.motion=false}else{S.lang=(navigator.language||'de').toLowerCase().startsWith('de')?'de':'en';S.motion=!matchMedia('(prefers-reduced-motion: reduce)').matches}
 lang=S.lang||'de';if(window.__LOCK)lang=S.lang=window.__LOCK;if(innerWidth<1100)$('#drawer').classList.add('hide');setLang(lang);
 if(S.boards.length){switchBoard(S.current&&S.boards.some(b=>b.id===S.current)?S.current:S.boards[0].id)}else{B={id:'tmp',name:'',format:innerWidth<700?'port':'land',bg:'paper',elements:[],strokes:[]};renderBoard();welcome(false)}
 requestAnimationFrame(loop)})();
</script>
