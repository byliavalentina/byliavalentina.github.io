*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f1ede7;color:#2e2a27;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
/* guest */
.gwrap,.scr{--bg:#fff;background:var(--bg);color:var(--ink);min-height:100%;position:relative;overflow-x:hidden}
.gwrap{min-height:100vh}
.gv{max-width:480px;margin:0 auto;padding:22px 20px 40px;text-align:center;position:relative}
.wave .gv{margin:14px auto;max-width:460px;background:var(--card);border-radius:4px;padding:30px 24px 40px;
 -webkit-mask:none;outline:2.5px solid var(--acc);outline-offset:-10px;border-radius:28px}
.hd{padding-top:6px}
.hd .hi{display:block;margin:0 auto 8px;height:150px;max-width:78%;object-fit:contain}
.hd.sm .hi{height:74px;margin-bottom:2px}
.hd .tt{font-family:var(--sf);font-weight:600;font-size:13px;letter-spacing:4px;color:var(--acc2);margin-top:4px}
.hd .w1{font-family:var(--hf);font-size:46px;line-height:1.05;color:var(--acc)}
.caps .hd .w1{font-weight:900;text-transform:uppercase;font-size:34px;letter-spacing:1px}
.hd .nm2{font-family:var(--sf);font-size:26px;letter-spacing:6px;line-height:1.25;margin-top:8px}
.hd .nm2 i{display:block;font-family:var(--hf);font-style:normal;letter-spacing:0;color:var(--acc);font-size:26px}
.hd .dt{font-family:var(--sf);font-size:15px;letter-spacing:2px;color:var(--sub);margin-top:8px}
.hd.sm .w1{font-size:30px}.hd.sm .tt,.hd.sm .dt{display:none}.hd.sm .nm2{font-size:16px;margin-top:0}.hd.sm .nm2 i{font-size:18px}
.caps .hd.sm .w1{font-size:22px}
.hello{font-family:var(--sf);font-style:italic;font-size:19px;color:var(--sub);margin:14px 0 4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px 13px;cursor:pointer;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile b{display:block;font-family:var(--sf);font-weight:600;font-size:17px;color:var(--acc);line-height:1.2}
.tile small{display:block;font-size:11px;color:var(--sub);margin-top:4px;letter-spacing:.3px}
.wave .tile{border-width:1.5px}
.namebox{margin-top:18px;text-align:left}.namebox label{display:block;font-family:var(--sf);font-size:18px;text-align:center;margin-bottom:8px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:30px;padding:13px 18px;font-size:16px;outline:none}
.in:focus{border-color:var(--acc)}
.btn{display:block;width:100%;margin-top:12px;border:0;border-radius:30px;padding:14px;background:var(--acc);color:#fff;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.foot{font-size:10.5px;color:var(--sub);margin-top:26px;opacity:.8}
.st{display:flex;align-items:center;gap:10px;margin:14px 0 12px;border-top:1px solid var(--line);padding-top:12px}
.st h2{flex:1;font-family:var(--sf);font-weight:600;font-size:20px;color:var(--acc);text-align:center;margin-right:48px}
.bk{border:0;background:none;color:var(--sub);font-size:14px;cursor:pointer;white-space:nowrap}
.prog{height:5px;background:var(--soft);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.pn{font-size:11px;letter-spacing:2px;color:var(--sub);margin:6px 0 10px}
.qq{font-family:var(--sf);font-size:22px;line-height:1.3;margin:6px 0 16px}
.opts{display:grid;gap:9px}.opts.two{grid-template-columns:1fr}
.opt{border:1.5px solid var(--acc);background:var(--card);color:var(--acc);border-radius:30px;padding:13px;font-weight:600;cursor:pointer;transition:all .15s}
.opt.sel{background:var(--acc);color:#fff}
.hint{font-size:12.5px;color:var(--sub);margin-top:12px;line-height:1.45}
.res{background:var(--soft);border-radius:18px;padding:20px;margin:6px 0 4px}
.res small{font-size:11px;letter-spacing:2px;color:var(--sub);text-transform:uppercase}
.res .big{font-family:var(--sf);font-size:52px;font-weight:600;color:var(--acc);line-height:1.1}
.res p{color:var(--sub)}
.rev{text-align:left;margin-top:14px;font-size:13.5px}.rev summary{cursor:pointer;color:var(--acc);font-weight:600;text-align:center}.rev p{padding:6px 0;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:10.5px;line-height:1.15;padding:3px;cursor:pointer;color:var(--ink);word-break:break-word;hyphens:auto}
.cell.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cell.free{background:var(--soft);color:var(--acc);font-size:22px}
.bingo{font-family:var(--hf);font-size:54px;color:var(--acc);margin-top:12px;animation:pop .5s}
.caps .bingo{font-weight:900}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.card{min-height:220px;border-radius:22px;background:var(--card);border:1.5px solid var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;font-family:var(--sf);font-size:22px;line-height:1.35;box-shadow:5px 6px 0 var(--soft);margin-top:6px}
.card small{font-family:'DM Sans';font-size:11px;letter-spacing:2px;color:var(--sub);margin-bottom:12px}
.card.flip{animation:flip .45s}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.form{text-align:left}.form label{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px 6px}
.chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;cursor:pointer;font-size:15px}
.chk i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--acc);flex:none}
.chk.on i{background:var(--acc);box-shadow:inset 0 0 0 4px var(--card)}.chk.on{color:var(--sub);text-decoration:line-through}
.inf{text-align:left}.inf h3{font-family:var(--sf);font-weight:600;font-size:19px;color:var(--acc);text-align:center;margin:12px 0 8px}
.tl{border-left:1px solid var(--line);margin-left:14px;padding-left:18px}.tl div{position:relative;padding:7px 0;font-size:15px}.tl div:before{content:"";position:absolute;left:-22px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.tl b{font-family:var(--sf);font-weight:600;color:var(--acc);margin-right:8px;font-size:16px}
.mn p{text-align:center;padding:8px 0;font-family:var(--sf);font-size:18px}.mn small{display:block;font-family:'DM Sans';font-size:10.5px;letter-spacing:2.5px;color:var(--sub)}
.seatr{margin-top:12px}.seatr .res{font-family:var(--sf);font-size:21px;margin-bottom:8px}
.cf{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards;z-index:9;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
/* host */
.host{min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid #e8e2da;position:sticky;top:0;z-index:5}
.brand{font-family:'Great Vibes';font-size:28px;color:#8a6a5c}
.nav{display:flex;gap:6px}.nav button{border:0;background:none;padding:9px 16px;border-radius:20px;cursor:pointer;font-weight:600;color:#7a7068}.nav button.on{background:#2e2a27;color:#fff}
.cols{display:flex;gap:30px;max-width:1180px;margin:0 auto;padding:24px}
.main{flex:1;min-width:0;max-width:640px}
.main h1{font-family:'Cormorant Garamond';font-weight:600;font-size:32px;margin-bottom:8px}
.main h3{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#8a7f73;margin:22px 0 10px}
.f{margin-bottom:12px}.f label{display:block;font-size:13px;color:#6f655d;margin-bottom:5px}
.f input,.f select,textarea,.qi input,.row input{width:100%;border:1px solid #ddd5cb;border-radius:12px;padding:11px 13px;background:#fff;font-size:15px}
textarea{resize:vertical;line-height:1.5}
.looks{display:flex;gap:10px;flex-wrap:wrap}.lk{border:1.5px solid #ddd5cb;background:#fff;border-radius:16px;padding:10px;width:150px;cursor:pointer;text-align:center}.lk.on{border-color:#2e2a27;box-shadow:0 0 0 2px #2e2a27}
.lk img{height:70px;max-width:100%;object-fit:contain;display:block;margin:0 auto 6px}.lk span{font-size:12.5px}
.gl{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:center;gap:7px;border:1px solid #ddd5cb;background:#fff;border-radius:20px;padding:8px 13px;cursor:pointer;font-size:14px}
.sec{background:#fff;border:1px solid #e8e2da;border-radius:16px;padding:14px 16px;margin-top:12px}.sec summary{cursor:pointer;font-weight:600}.sec[open] summary{margin-bottom:12px}
.qi{border-bottom:1px solid #eee7df;padding:12px 0}.qh{display:flex;gap:8px;align-items:center}.qh b{color:#8a7f73;width:24px}
.oi{display:flex;gap:8px;align-items:center;margin:6px 0 0 32px}.oi span{font-size:13px;color:#8a7f73}.rb{display:flex;gap:6px;align-items:center;font-size:14px;margin-right:14px;cursor:pointer}
.x{border:0;background:#f4eee8;width:32px;height:32px;border-radius:50%;cursor:pointer;flex:none;font-size:18px;color:#8a7f73}
.b1,.b2{display:inline-block;border:0;border-radius:24px;padding:11px 18px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px;margin:10px 8px 0 0}
.b1{background:#2e2a27;color:#fff}.b2{background:#fff;border:1.5px solid #2e2a27;color:#2e2a27}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:140px}
.qr{display:block;max-width:300px;width:100%;border:1px solid #e8e2da;border-radius:12px;background:#fff}
.rk{margin:16px 0 0 0;list-style:none;counter-reset:r}.rk li{counter-increment:r;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e8e2da;border-radius:12px;padding:11px 14px;margin-top:6px}.rk li:before{content:counter(r);font-weight:700;color:#8a6a5c;width:22px}.rk li span{flex:1}
.hint{font-size:13px;color:#7a7068;line-height:1.5}
.pcol{width:360px;flex:none}
.phone{position:sticky;top:90px;width:360px;height:740px;border-radius:48px;background:#1d1b1a;padding:12px;box-shadow:0 20px 40px rgba(60,40,20,.15)}
.phone .scr{height:100%;border-radius:37px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.phone .scr .gv{padding-top:34px}
@media(max-width:900px){.cols{flex-direction:column}.pcol{width:100%}.phone{position:static;margin:0 auto;width:min(360px,100%)}}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
