:root{--paper:#fbf7f0;--bg:#f2ece2;--card:#fffdf9;--ink:#2f2a26;--mute:#8a7f74;--line:#e6ddd0;--acc:#5f7d6b;--acc-l:#e6eee8;--rose:#c98b8b;--rose-l:#f6e6e3;--warn:#b5654a;
--fr:#e9c46a;--zw:#e8a87c;--sp:#c98b8b;--na:#3d4f7a;--h24:#7d5a7c;--bd:#7f9c84;--fr-l:#fbf1d6;--zw-l:#fbe8da;--sp-l:#f6e6e3;--na-l:#e1e6f1;--h24-l:#efe5ee;--bd-l:#e5ede6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15.5px;line-height:1.45}
body{background:var(--bg) radial-gradient(circle at 20% 0%,rgba(255,255,255,.7),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 2px 10px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 78%,transparent)}
.brand h1{font-family:'Caveat';font-weight:700;font-size:34px;margin:0;line-height:1;color:var(--ink)}
.brand small{display:block;font-size:12px;color:var(--mute);letter-spacing:.04em;margin-top:2px}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.ibtn svg{width:20px;height:20px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(251,247,240,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:720px;width:100%}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;color:var(--mute);font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc)}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(82px + env(safe-area-inset-bottom));z-index:31;background:var(--ink);color:#fff;border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 8px 24px rgba(47,42,38,.28);display:flex;gap:8px;align-items:center}
.fab svg{width:20px;height:20px}
h2.sec{font-family:'Fraunces';font-weight:600;font-size:20px;margin:18px 2px 10px}
.hint{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.tape{position:absolute;top:-9px;left:22px;width:74px;height:20px;background:rgba(201,139,139,.35);transform:rotate(-4deg);border-radius:2px}
.tape.g{background:rgba(127,156,132,.35);left:auto;right:26px;transform:rotate(3deg)}
.tape.y{background:rgba(233,196,106,.45)}
/* entry list */
.entry{display:flex;gap:12px;align-items:stretch;cursor:pointer}
.datebox{width:54px;flex:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;font-weight:600}
.datebox b{font-family:'Fraunces';font-size:22px;line-height:1}
.datebox span{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.entry .meta{flex:1;min-width:0}
.entry .ttl{display:flex;gap:6px;align-items:center;font-weight:600}
.entry .snip{font-family:'Caveat';font-size:21px;line-height:1.15;color:var(--ink);opacity:.85;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.mood{width:26px;height:26px;flex:none}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty .big{font-family:'Caveat';font-size:30px;color:var(--ink)}
.memo{background:var(--rose-l);border:0}
.memo .q{font-family:'Caveat';font-size:24px;line-height:1.15;margin:4px 0}
.carry{background:#fff7e3;border:1px dashed #e3c886}
/* editor */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(var(--bg) 80%,transparent);max-width:720px;margin:0 auto}
.sheet .body{max-width:720px;margin:0 auto;padding:0 14px 120px}
.btn{padding:10px 16px;border-radius:12px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.danger{color:var(--warn)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.types button{padding:12px 6px;border-radius:14px;border:2px solid transparent;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.types button svg{width:24px;height:24px}
.types button.on{border-color:var(--ink)}
label.l{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:10px 0 4px;letter-spacing:.02em}
input.f,select.f,textarea.f{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none;font-size:16px}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--acc)}
textarea.f{resize:none;min-height:64px;line-height:1.25;background-position:0 9px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.q h3{display:flex;align-items:center;gap:8px;font-family:'Fraunces';font-weight:600;font-size:17px;margin:0 0 2px}
.q h3 i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.q h3 i svg{width:17px;height:17px}
.q p.sub{margin:0 0 8px;font-size:13px;color:var(--mute)}
.scale{display:flex;justify-content:space-between;gap:6px}
.scale button{flex:1;padding:8px 0;border-radius:12px;border:2px solid transparent;display:flex;justify-content:center;background:#fff}
.scale button.on{border-color:var(--ink);background:var(--paper)}
.scale svg{width:34px;height:34px}
.checks .it{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.checks .it input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:none}
.checks .it input[type=text]{flex:1;border:0;background:none;outline:none;font-family:'Caveat';font-size:23px;min-width:0}
.checks .it.done input[type=text]{text-decoration:line-through;color:var(--mute)}
.x{color:var(--mute);font-size:20px;padding:0 4px}
.add{color:var(--acc);font-weight:600;font-size:14px;padding:8px 0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#fff;padding:6px 6px 22px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:2px;right:2px;background:rgba(255,255,255,.9);border-radius:50%;width:24px;height:24px;font-size:15px}
